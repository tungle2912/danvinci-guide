<svg xmlns="http://www.w3.org/2000/svg" width="680" height="392" viewBox="0 0 680 392" role="img"><title>Chỉnh gì ở đâu trên trang Photo: tab RAW, tab Photo của Inspector và nút Tools dưới Viewer</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="tl"><rect class="bx" x="16" y="20" width="200" height="60" rx="8"/><text class="t" stroke="none" x="116" y="45.5" text-anchor="middle">Tab RAW</text><text class="s" stroke="none" x="116" y="64.5" text-anchor="middle">Chỉ sáng với file RAW</text></g>
<g class="tl"><rect class="bx" x="16" y="96" width="200" height="204" rx="8"/><text class="s" stroke="none" x="116" y="122" text-anchor="middle">White Balance · Temp · Tint</text><text class="s" stroke="none" x="116" y="141" text-anchor="middle">Exposure</text><text class="s" stroke="none" x="116" y="160" text-anchor="middle">Highlights · Shadows</text><text class="s" stroke="none" x="116" y="179" text-anchor="middle">Lift · Gain · Contrast</text><text class="s" stroke="none" x="116" y="198" text-anchor="middle">Color Boost · Saturation</text><text class="s" stroke="none" x="116" y="217" text-anchor="middle">Midtone Detail · Sharpness</text><text class="s" stroke="none" x="116" y="236" text-anchor="middle">Noise Reduction</text><text class="s" stroke="none" x="116" y="255" text-anchor="middle">Decode Quality · Gamma</text></g>
<g class="pu"><rect class="bx" x="246" y="20" width="200" height="60" rx="8"/><text class="t" stroke="none" x="346" y="45.5" text-anchor="middle">Tab Photo</text><text class="s" stroke="none" x="346" y="64.5" text-anchor="middle">Mọi ảnh: JPG, PNG, RAW</text></g>
<g class="pu"><rect class="bx" x="246" y="96" width="200" height="204" rx="8"/><text class="s" stroke="none" x="346" y="122" text-anchor="middle">Auto Balance</text><text class="s" stroke="none" x="346" y="141" text-anchor="middle">Temp · Tint</text><text class="s" stroke="none" x="346" y="160" text-anchor="middle">Lift · Gamma · Gain</text><text class="s" stroke="none" x="346" y="179" text-anchor="middle">Contrast · Pivot</text><text class="s" stroke="none" x="346" y="198" text-anchor="middle">Shadows · Highlights</text><text class="s" stroke="none" x="346" y="217" text-anchor="middle">Saturation · Hue</text><text class="s" stroke="none" x="346" y="236" text-anchor="middle">Looks</text><text class="s" stroke="none" x="346" y="255" text-anchor="middle">Source Transform (gõ số)</text><text class="s" stroke="none" x="346" y="274" text-anchor="middle">Source Cropping (gõ số)</text></g>
<g class="co"><rect class="bx" x="476" y="20" width="200" height="60" rx="8"/><text class="t" stroke="none" x="576" y="45.5" text-anchor="middle">Tools dưới Viewer</text><text class="s" stroke="none" x="576" y="64.5" text-anchor="middle">Kéo tay trên ảnh</text></g>
<g class="co"><rect class="bx" x="476" y="96" width="200" height="204" rx="8"/><text class="s" stroke="none" x="576" y="122" text-anchor="middle">Transform: xoay, zoom</text><text class="s" stroke="none" x="576" y="141" text-anchor="middle">Pitch · Yaw · Flip</text><text class="s" stroke="none" x="576" y="160" text-anchor="middle">Crop: tỉ lệ 4:5, 9:16…</text><text class="s" stroke="none" x="576" y="179" text-anchor="middle">Looks: Look Selector</text><text class="s" stroke="none" x="576" y="198" text-anchor="middle">Effects Overlay</text></g>
<line class="ar" x1="218" y1="50" x2="242" y2="50" marker-end="url(#a)"/>
<line class="ar" x1="448" y1="50" x2="472" y2="50" marker-end="url(#a)"/>
<g class="gy"><rect class="bx" x="16" y="320" width="660" height="56" rx="8"/><text class="t" stroke="none" x="346" y="343.5" text-anchor="middle">Thứ tự làm: tab RAW → tab Photo → Tools → hiệu ứng</text><text class="s" stroke="none" x="346" y="362.5" text-anchor="middle">Ảnh RAW: sáng và màu ở tab RAW trước. Crop, xoay: gõ số ở tab Photo, kéo tay ở Tools</text></g>
</svg>
