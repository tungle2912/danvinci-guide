<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img"><title>Dòng chảy node từ MediaIn qua Merge tới MediaOut, với ba loại đầu vào</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gy"><rect class="bx" x="30" y="30" width="130" height="56" rx="8"/><text class="t" x="95" y="54" text-anchor="middle">TieuDe</text><text class="s" x="95" y="72" text-anchor="middle">Text+ (chữ)</text></g>
<g class="gy"><rect class="bx" x="200" y="30" width="130" height="56" rx="8"/><text class="t" x="265" y="54" text-anchor="middle">Transform1</text><text class="s" x="265" y="72" text-anchor="middle">Dời, xoay chữ</text></g>
<g class="gy"><rect class="bx" x="30" y="130" width="130" height="56" rx="8"/><text class="t" x="95" y="154" text-anchor="middle">MediaIn1</text><text class="s" x="95" y="172" text-anchor="middle">Clip từ timeline</text></g>
<g class="tl"><rect class="bx" x="370" y="130" width="130" height="56" rx="8"/><text class="t" x="435" y="154" text-anchor="middle">Merge1</text><text class="s" x="435" y="172" text-anchor="middle">Ghép hai lớp</text></g>
<g class="gy"><rect class="bx" x="530" y="130" width="130" height="56" rx="8"/><text class="t" x="595" y="154" text-anchor="middle">MediaOut1</text><text class="s" x="595" y="172" text-anchor="middle">Trả về timeline</text></g>
<g class="gy"><rect class="bx" x="200" y="236" width="130" height="56" rx="8"/><text class="t" x="265" y="260" text-anchor="middle">Ellipse1</text><text class="s" x="265" y="278" text-anchor="middle">Mask hình elip</text></g>
<line class="ar" x1="160" y1="58" x2="198" y2="58" marker-end="url(#a)"/>
<path class="ar" d="M330 58 H435 V128" marker-end="url(#a)"/>
<line class="ar" x1="160" y1="158" x2="368" y2="158" marker-end="url(#a)"/>
<line class="ar" x1="500" y1="158" x2="528" y2="158" marker-end="url(#a)"/>
<path class="ar" d="M330 264 H435 V188" marker-end="url(#a)"/>
<g class="tl"><rect class="bx" x="445" y="80" width="146" height="18" rx="9"/><text class="s" x="518" y="93" text-anchor="middle">Foreground · xanh lá</text></g>
<g class="co"><rect class="bx" x="190" y="166" width="126.5" height="18" rx="9"/><text class="s" x="253.25" y="179" text-anchor="middle">Background · vàng</text></g>
<g class="pu"><rect class="bx" x="445" y="210" width="172" height="18" rx="9"/><text class="s" x="531" y="223" text-anchor="middle">Effect Mask · xanh dương</text></g>
<g class="gy"><text class="s" x="20" y="318">Tam giác trên node là đầu vào, ô vuông là đầu ra. Node không nối tới MediaOut thì không lên video.</text></g>
</svg>
