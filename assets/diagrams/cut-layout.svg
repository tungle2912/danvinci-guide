<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img"><title>Bố cục trang Cut</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gy"><rect class="bx" x="40" y="30" width="600" height="430" rx="20"/></g>
<g class="pu"><rect class="bx" x="60" y="50" width="560" height="52" rx="8"/><text class="s" x="340" y="71" text-anchor="middle">Trái: Media Pool · Sync Bin · Keyframes · Transitions · Titles · Effects</text><text class="s" x="340" y="90" text-anchor="middle">Phải: Quick Export · Full Screen · Mixer · Inspector</text></g>
<g class="pu"><rect class="bx" x="60" y="118" width="250" height="150" rx="10"/><text class="t" x="185" y="168" text-anchor="middle">Media Pool</text><text class="s" x="185" y="190" text-anchor="middle">Clip đã nạp, chọn bin</text></g>
<g class="co"><rect class="bx" x="70" y="224" width="230" height="34" rx="6"/><text class="s" x="185" y="246" text-anchor="middle">6 nút edit ở đáy Media Pool</text></g>
<g class="tl"><rect class="bx" x="326" y="118" width="294" height="150" rx="10"/><text class="t" x="473" y="168" text-anchor="middle">Viewer</text><text class="s" x="473" y="190" text-anchor="middle">4 nút chế độ ở góc trên trái</text><text class="s" x="473" y="210" text-anchor="middle">Thanh Tools, phát, I/O ở đáy</text></g>
<g class="tl"><rect class="bx" x="60" y="284" width="560" height="50" rx="10"/><text class="t" x="340" y="305" text-anchor="middle">Timeline trên</text><text class="s" x="340" y="323" text-anchor="middle">Luôn hiện toàn bộ video — dùng để nhảy và kéo clip đi xa</text></g>
<g class="co"><rect class="bx" x="60" y="350" width="560" height="90" rx="10"/><text class="t" x="340" y="384" text-anchor="middle">Timeline dưới</text><text class="s" x="340" y="404" text-anchor="middle">Phóng to quanh con trỏ — dùng để cắt, trim chi tiết</text><text class="s" x="340" y="422" text-anchor="middle">Góc trên trái: Timeline Options · Timeline Actions · Edit Actions</text></g>
</svg>
