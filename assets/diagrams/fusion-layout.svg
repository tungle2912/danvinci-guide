<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img"><title>Bố cục trang Fusion</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gy"><rect class="bx" x="40" y="30" width="600" height="430" rx="20"/></g>
<g class="pu"><rect class="bx" x="60" y="50" width="560" height="40" rx="8"/><text class="s" x="340" y="75" text-anchor="middle">Trái: Media Pool · Effects · Clips · Nodes — Phải: Spline · Keyframes · Metadata · Inspector</text></g>
<g class="tl"><rect class="bx" x="60" y="106" width="200" height="130" rx="10"/><text class="t" x="160" y="160" text-anchor="middle">Viewer 1 (trái)</text><text class="s" x="160" y="182" text-anchor="middle">Chọn node, bấm 1</text></g>
<g class="tl"><rect class="bx" x="270" y="106" width="200" height="130" rx="10"/><text class="t" x="370" y="160" text-anchor="middle">Viewer 2 (phải)</text><text class="s" x="370" y="182" text-anchor="middle">Chọn node, bấm 2</text></g>
<g class="co"><rect class="bx" x="486" y="106" width="134" height="334" rx="10"/><text class="t" x="553" y="250" text-anchor="middle">Inspector</text><text class="s" x="553" y="272" text-anchor="middle">Thông số node</text><text class="s" x="553" y="290" text-anchor="middle">đang chọn</text></g>
<g class="gy"><rect class="bx" x="60" y="250" width="410" height="34" rx="6"/></g><text class="s" fill="#5F5E5A" x="265" y="272" text-anchor="middle">Time Ruler · nút phát · khung hiện tại</text>
<g class="pu"><rect class="bx" x="60" y="294" width="410" height="34" rx="6"/><text class="s" x="265" y="316" text-anchor="middle">Thanh công cụ: các node hay dùng, bấm là thêm</text></g>
<g class="co"><rect class="bx" x="60" y="338" width="410" height="102" rx="10"/><text class="t" x="265" y="378" text-anchor="middle">Node Editor</text><text class="s" x="265" y="400" text-anchor="middle">Nơi nối node — có thể mở Spline, Keyframes</text><text class="s" x="265" y="418" text-anchor="middle">nằm cạnh trong cùng vùng này</text></g>
</svg>
