<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img"><title>Tìm nguyên nhân tiếng lệch hình: lệch dần hay lệch đều</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="co"><rect class="bx" x="190" y="20" width="300" height="48" rx="8"/><text class="t" x="340" y="49" text-anchor="middle">Tiếng lệch hình</text></g>
<path class="ar" d="M340 68 L340 96" marker-end="url(#a)"/>
<g class="gy"><rect class="bx" x="190" y="100" width="300" height="56" rx="8"/><text class="t" x="340" y="123" text-anchor="middle">Lệch thế nào?</text><text class="s" x="340" y="143" text-anchor="middle">So đầu clip với cuối clip</text></g>
<path class="ar" d="M300 156 L300 176 L180 176 L180 196" marker-end="url(#a)"/>
<path class="ar" d="M380 156 L380 176 L500 176 L500 196" marker-end="url(#a)"/>
<g class="gy"><rect class="bx" x="40" y="200" width="280" height="56" rx="8"/><text class="t" x="180" y="223" text-anchor="middle">Lệch dần, cuối lệch hơn đầu</text><text class="s" x="180" y="243" text-anchor="middle">Thường do frame rate không khớp</text></g>
<g class="gy"><rect class="bx" x="360" y="200" width="280" height="56" rx="8"/><text class="t" x="500" y="223" text-anchor="middle">Lệch đều từ đầu tới cuối</text><text class="s" x="500" y="243" text-anchor="middle">Lỡ kéo hình và tiếng rời nhau</text></g>
<path class="ar" d="M180 256 L180 296" marker-end="url(#a)"/>
<path class="ar" d="M500 256 L500 296" marker-end="url(#a)"/>
<g class="tl"><rect class="bx" x="40" y="300" width="280" height="56" rx="8"/><text class="t" x="180" y="323" text-anchor="middle">So ba chỗ frame rate</text><text class="s" x="180" y="343" text-anchor="middle">Clip · Timeline · Deliver</text></g>
<g class="gy"><rect class="bx" x="360" y="300" width="280" height="56" rx="8"/><text class="t" x="500" y="323" text-anchor="middle">Có số đỏ ở tên clip?</text><text class="s" x="500" y="343" text-anchor="middle">Số đỏ là khoảng bị lệch</text></g>
<path class="ar" d="M560 356 L560 396" marker-end="url(#a)"/>
<path class="ar" d="M440 356 L440 378 L180 378 L180 396" marker-end="url(#a)"/>
<g class="gy"><text class="s" x="574" y="384" text-anchor="start">Có</text></g>
<g class="gy"><text class="s" x="190" y="392" text-anchor="start">Không</text></g>
<g class="tl"><rect class="bx" x="360" y="400" width="280" height="56" rx="8"/><text class="t" x="500" y="423" text-anchor="middle">Chuột phải số đỏ</text><text class="s" x="500" y="443" text-anchor="middle">Slip into place hoặc Move into place</text></g>
<g class="gy"><rect class="bx" x="40" y="400" width="280" height="56" rx="8"/><text class="t" x="180" y="423" text-anchor="middle">Lệch từ lúc quay</text><text class="s" x="180" y="443" text-anchor="middle">Auto Sync Audio, hoặc dời tay</text></g>
<g class="gy"><text class="s" x="340" y="494" text-anchor="middle">Số đỏ hiện khi tắt Linked Selection rồi kéo riêng hình hoặc tiếng (tr. 938).</text></g>
</svg>
