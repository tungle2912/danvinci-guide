<g class="tl"><rect class="bx" x="354" y="16" width="153" height="64" rx="8"/><text class="t" stroke="none" x="430.5" y="43.5" text-anchor="middle">3  Tab RAW</text><text class="s" stroke="none" x="430.5" y="62.5" text-anchor="middle">WB, Exposure</text></g>
<g class="tl"><rect class="bx" x="523" y="16" width="153" height="64" rx="8"/><text class="t" stroke="none" x="599.5" y="43.5" text-anchor="middle">4  Tab Photo</text><text class="s" stroke="none" x="599.5" y="62.5" text-anchor="middle">Auto Balance, Looks</text></g>
<g class="tl"><rect class="bx" x="523" y="108" width="153" height="64" rx="8"/><text class="t" stroke="none" x="599.5" y="135.5" text-anchor="middle">5  Crop</text><text class="s" stroke="none" x="599.5" y="154.5" text-anchor="middle">Tools → Crop 4:5</text></g>
<g class="tl"><rect class="bx" x="354" y="108" width="153" height="64" rx="8"/><text class="t" stroke="none" x="430.5" y="135.5" text-anchor="middle">6  Áp cả loạt</text><text class="s" stroke="none" x="430.5" y="154.5" text-anchor="middle">Paste Attributes ⌥V</text></g>
<g class="pu"><rect class="bx" x="185" y="108" width="153" height="64" rx="8"/><text class="t" stroke="none" x="261.5" y="135.5" text-anchor="middle">7  Từng vùng</text><text class="s" stroke="none" x="261.5" y="154.5" text-anchor="middle">trang Color, nếu cần</text></g>
<g class="co"><rect class="bx" x="16" y="108" width="153" height="64" rx="8"/><text class="t" stroke="none" x="92.5" y="135.5" text-anchor="middle">8  Xuất</text><text class="s" stroke="none" x="92.5" y="154.5" text-anchor="middle">Quick Export</text></g>
