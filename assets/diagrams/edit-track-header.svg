<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" role="img"><title>Đầu track: cột Source xanh, cột Destination đỏ và Sync Lock</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gy"><text class="t" x="16" y="26" text-anchor="start">Clip nguồn có 1 hình, 1 tiếng — đang cắm vào V2 và A1</text></g>
<g class="tl"><rect class="bx" x="24" y="44" width="50" height="30" rx="4"/>
<text class="s" x="49.0" y="64.0" text-anchor="middle">V1</text>
</g>
<line class="ar" x1="76" y1="59" x2="92" y2="59" marker-end="url(#a)"/>
<g class="co"><rect class="bx" x="96" y="44" width="50" height="30" rx="4"/>
<text class="s" x="121.0" y="64.0" text-anchor="middle">V2</text>
</g>
<g class="gy"><rect class="bx" x="156" y="44" width="74" height="30" rx="4"/>
<text class="s" x="193.0" y="64.0" text-anchor="middle">khoá</text>
</g>
<g class="pu"><rect class="bx" x="238" y="44" width="90" height="30" rx="4"/>
<text class="s" x="283.0" y="64.0" text-anchor="middle">Sync Lock</text>
</g>
<g class="gy"><rect class="bx" x="336" y="44" width="76" height="30" rx="4"/>
<text class="s" x="374.0" y="64.0" text-anchor="middle">tên track</text>
</g>
<g class="co"><rect class="bx" x="96" y="84" width="50" height="30" rx="4"/>
<text class="s" x="121.0" y="104.0" text-anchor="middle">V1</text>
</g>
<g class="gy"><rect class="bx" x="156" y="84" width="74" height="30" rx="4"/>
<text class="s" x="193.0" y="104.0" text-anchor="middle">khoá</text>
</g>
<g class="pu"><rect class="bx" x="238" y="84" width="90" height="30" rx="4"/>
<text class="s" x="283.0" y="104.0" text-anchor="middle">Sync Lock</text>
</g>
<g class="gy"><rect class="bx" x="336" y="84" width="76" height="30" rx="4"/>
<text class="s" x="374.0" y="104.0" text-anchor="middle">tên track</text>
</g>
<g class="tl"><rect class="bx" x="24" y="124" width="50" height="30" rx="4"/>
<text class="s" x="49.0" y="144.0" text-anchor="middle">A1</text>
</g>
<line class="ar" x1="76" y1="139" x2="92" y2="139" marker-end="url(#a)"/>
<g class="co"><rect class="bx" x="96" y="124" width="50" height="30" rx="4"/>
<text class="s" x="121.0" y="144.0" text-anchor="middle">A1</text>
</g>
<g class="gy"><rect class="bx" x="156" y="124" width="74" height="30" rx="4"/>
<text class="s" x="193.0" y="144.0" text-anchor="middle">khoá</text>
</g>
<g class="pu"><rect class="bx" x="238" y="124" width="90" height="30" rx="4"/>
<text class="s" x="283.0" y="144.0" text-anchor="middle">Sync Lock</text>
</g>
<g class="gy"><rect class="bx" x="336" y="124" width="76" height="30" rx="4"/>
<text class="s" x="374.0" y="144.0" text-anchor="middle">tên track</text>
</g>
<g class="gy"><rect class="bx" x="96" y="164" width="50" height="30" rx="4"/>
<text class="s" x="121.0" y="184.0" text-anchor="middle">A2</text>
</g>
<g class="gy"><rect class="bx" x="156" y="164" width="74" height="30" rx="4"/>
<text class="s" x="193.0" y="184.0" text-anchor="middle">khoá</text>
</g>
<g class="pu"><rect class="bx" x="238" y="164" width="90" height="30" rx="4"/>
<text class="s" x="283.0" y="184.0" text-anchor="middle">Sync Lock</text>
</g>
<g class="gy"><rect class="bx" x="336" y="164" width="76" height="30" rx="4"/>
<text class="s" x="374.0" y="184.0" text-anchor="middle">tên track</text>
</g>
<g class="gy"><text class="s" x="24" y="220" text-anchor="start">Xanh = track của clip nguồn. Đỏ sáng = track được lệnh tác động (A2 tối: ⌘\ không cắt A2)</text></g>
<g class="gy"><text class="s" x="24" y="242" text-anchor="start">Sync Lock bật = track dồn theo khi bạn ripple ở track khác</text></g>
<g class="gy"><rect class="bx" x="432" y="44" width="232" height="150" rx="8"/>
</g>
<g class="gy"><text class="t" x="444" y="68">Phím</text><text class="s" x="444" y="92">⌥1–8 · ⌘⌥1–8  cắm nguồn</text><text class="s" x="444" y="114">⌥F1–F8 · ⌘⌥F1–F8  ô đỏ</text><text class="s" x="444" y="136">⌥F9 · ⌘⌥F9  mọi ô đỏ</text><text class="s" x="444" y="158">⌥-bấm ô đỏ  chỉ track đó</text><text class="s" x="444" y="180">⌥⇧1–8 · ⌥⇧F1–F8  khoá</text></g>
