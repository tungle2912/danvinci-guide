<g class="co"><rect class="bx" x="282" y="150" width="116" height="70" rx="8"/><text class="t" x="340" y="181" text-anchor="middle">Clip hiện đỏ?</text><text class="s" x="340" y="199" text-anchor="middle">File bị dời</text></g>
