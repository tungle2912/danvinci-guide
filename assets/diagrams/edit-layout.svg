<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" role="img"><title>Bố cục trang Edit</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gy"><rect class="bx" x="40" y="40" width="600" height="330" rx="20"/><text class="t" x="340" y="68" text-anchor="middle">Trang Edit</text></g>
<g class="pu"><rect class="bx" x="60" y="86" width="130" height="104" rx="10"/><text class="t" x="125" y="123" text-anchor="middle">Media pool</text><text class="s" x="125" y="145" text-anchor="middle">Kho clip, bin</text></g>
<g class="tl"><rect class="bx" x="206" y="86" width="130" height="104" rx="10"/><text class="t" x="271" y="123" text-anchor="middle">Source</text><text class="s" x="271" y="145" text-anchor="middle">Xem clip gốc</text></g>
<g class="tl"><rect class="bx" x="352" y="86" width="130" height="104" rx="10"/><text class="t" x="417" y="123" text-anchor="middle">Timeline</text><text class="s" x="417" y="145" text-anchor="middle">Xem bản dựng</text></g>
<g class="pu"><rect class="bx" x="498" y="86" width="122" height="104" rx="10"/><text class="t" x="559" y="123" text-anchor="middle">Inspector</text><text class="s" x="559" y="145" text-anchor="middle">Transform, crop</text></g>
<g class="pu"><rect class="bx" x="60" y="206" width="560" height="40" rx="10"/><text class="s" x="340" y="231" text-anchor="middle">Toolbar — chọn A, trim T, dao cắt B, nam châm N</text></g>
<g class="pu"><rect class="bx" x="60" y="262" width="560" height="88" rx="10"/><text class="t" x="340" y="297" text-anchor="middle">Timeline</text><text class="s" x="340" y="321" text-anchor="middle">Track hình V1, V2 ở trên — track tiếng A1, A2 ở dưới</text></g>
</svg>
