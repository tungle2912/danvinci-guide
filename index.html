<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Sổ tay DaVinci Resolve 21</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse@1/dist/sidebar.min.css">
  <style>
    :root { --theme-color: #d4553f; }
    .markdown-section { max-width: 920px; }
    .markdown-section table { display: table; width: 100%; }
    .markdown-section img { border-radius: 8px; }
    .markdown-section code { color: #c0341d; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'DaVinci Resolve 21',
      loadSidebar: 'SUMMARY.md',
      sidebarDisplayLevel: 1,
      subMaxLevel: 3,
      auto2top: true,
      relativePath: true,
      search: { placeholder: 'Tìm trong tài liệu…', noData: 'Không có kết quả', depth: 3 }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse@1/dist/docsify-sidebar-collapse.min.js"></script>
</body>
</html>
