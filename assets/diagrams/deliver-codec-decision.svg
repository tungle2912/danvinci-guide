<svg xmlns="http://www.w3.org/2000/svg" width="680" height="434" viewBox="0 0 680 434" role="img"><title>Chọn preset và codec theo mục đích xuất</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="pu"><rect class="bx" x="190" y="16" width="300" height="44" rx="8"/><text class="t" x="340" y="42" text-anchor="middle">Bạn xuất file để làm gì?</text></g>
<g class="tl"><rect class="bx" x="40" y="84" width="200" height="52" rx="8"/><text class="t" x="140" y="114" text-anchor="middle">Đăng YouTube, Facebook</text></g>
<g class="co"><rect class="bx" x="290" y="84" width="370" height="52" rx="8"/><text class="t" x="475" y="105" text-anchor="middle">Preset YouTube · 1080p hoặc 2160p</text><text class="s" x="475" y="125" text-anchor="middle">MP4 · H.264 · AAC</text></g>
<line class="ar" x1="242" y1="110" x2="282" y2="110" marker-end="url(#a)"/>
<line class="ar" x1="20" y1="110" x2="34" y2="110" marker-end="url(#a)"/>
<g class="tl"><rect class="bx" x="40" y="148" width="200" height="52" rx="8"/><text class="t" x="140" y="178" text-anchor="middle">TikTok, Reels, Shorts</text></g>
<g class="co"><rect class="bx" x="290" y="148" width="370" height="52" rx="8"/><text class="t" x="475" y="169" text-anchor="middle">Preset TikTok · 1080p</text><text class="s" x="475" y="189" text-anchor="middle">Tick Use vertical resolution → 1080×1920</text></g>
<line class="ar" x1="242" y1="174" x2="282" y2="174" marker-end="url(#a)"/>
<line class="ar" x1="20" y1="174" x2="34" y2="174" marker-end="url(#a)"/>
<g class="tl"><rect class="bx" x="40" y="212" width="200" height="52" rx="8"/><text class="t" x="140" y="242" text-anchor="middle">Gửi khách xem, góp ý</text></g>
<g class="co"><rect class="bx" x="290" y="212" width="370" height="52" rx="8"/><text class="t" x="475" y="233" text-anchor="middle">Custom Export · MP4 · H.264</text><text class="s" x="475" y="253" text-anchor="middle">720p hoặc 1080p · Restrict to 5000 Kb/s</text></g>
<line class="ar" x1="242" y1="238" x2="282" y2="238" marker-end="url(#a)"/>
<line class="ar" x1="20" y1="238" x2="34" y2="238" marker-end="url(#a)"/>
<g class="tl"><rect class="bx" x="40" y="276" width="200" height="52" rx="8"/><text class="t" x="140" y="306" text-anchor="middle">Lưu bản gốc, làm tiếp</text></g>
<g class="co"><rect class="bx" x="290" y="276" width="370" height="52" rx="8"/><text class="t" x="475" y="297" text-anchor="middle">Preset ProRes 422 HQ</text><text class="s" x="475" y="317" text-anchor="middle">QuickTime · Linear PCM · file rất nặng</text></g>
<line class="ar" x1="242" y1="302" x2="282" y2="302" marker-end="url(#a)"/>
<line class="ar" x1="20" y1="302" x2="34" y2="302" marker-end="url(#a)"/>
<g class="tl"><rect class="bx" x="40" y="340" width="200" height="52" rx="8"/><text class="t" x="140" y="370" text-anchor="middle">Chỉ cần tiếng</text></g>
<g class="co"><rect class="bx" x="290" y="340" width="370" height="52" rx="8"/><text class="t" x="475" y="361" text-anchor="middle">Preset Audio Only, đổi sang WAVE</text><text class="s" x="475" y="381" text-anchor="middle">Linear PCM 24-bit · hoặc MP3 cho podcast</text></g>
<line class="ar" x1="242" y1="366" x2="282" y2="366" marker-end="url(#a)"/>
<line class="ar" x1="20" y1="366" x2="34" y2="366" marker-end="url(#a)"/>
<path d="M190 38 L20 38 L20 366" fill="none" stroke="#888780" stroke-width="1.5"/>
<g class="tl"><text class="s" x="340" y="418" text-anchor="middle">Không chắc thì chọn MP4 + H.264: mở được ở mọi nơi</text></g>
</svg>
