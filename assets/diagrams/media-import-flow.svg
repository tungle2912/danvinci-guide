<g class="tl"><rect class="bx" x="151" y="30" width="116" height="70" rx="8"/><text class="t" x="209" y="61" text-anchor="middle">2 Tạo bin</text><text class="s" x="209" y="79" text-anchor="middle">Chia thư mục</text></g>
