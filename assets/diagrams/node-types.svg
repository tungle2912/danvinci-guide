<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" role="img"><title>Bốn kiểu node</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="tl"><rect class="bx" x="50" y="50" width="140" height="70" rx="8"/><text class="t" x="120" y="80" text-anchor="middle">Serial ⌥S</text><text class="s" x="120" y="102" text-anchor="middle">Nối tiếp nhau</text></g>
<g class="tl"><rect class="bx" x="210" y="50" width="140" height="70" rx="8"/><text class="t" x="280" y="80" text-anchor="middle">Parallel ⌥P</text><text class="s" x="280" y="102" text-anchor="middle">Song song, trộn lại</text></g>
<g class="pu"><rect class="bx" x="370" y="50" width="140" height="70" rx="8"/><text class="t" x="440" y="80" text-anchor="middle">Layer ⌥L</text><text class="s" x="440" y="102" text-anchor="middle">Chồng, có blend</text></g>
<g class="co"><rect class="bx" x="530" y="50" width="140" height="70" rx="8"/><text class="t" x="600" y="80" text-anchor="middle">Outside ⌥O</text><text class="s" x="600" y="102" text-anchor="middle">Lấy vùng ngược lại</text></g>
<g class="gy"><rect class="bx" x="50" y="150" width="620" height="60" rx="10"/><text class="s" x="360" y="177" text-anchor="middle">Outside chỉ dùng được ngay sau một node đã tách vùng bằng Qualifier hoặc Power Window.</text><text class="s" x="360" y="196" text-anchor="middle">Nó tự lấy phần nghịch đảo của mặt nạ đó.</text></g>
</svg>
