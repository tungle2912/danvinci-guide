<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img"><title>Bố cục trang Deliver</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gy"><rect class="bx" x="40" y="30" width="600" height="430" rx="20"/></g>
<g class="pu"><rect class="bx" x="60" y="50" width="560" height="40" rx="8"/><text class="s" x="340" y="75" text-anchor="middle">Trái: Render Settings · Tape · Clips (lọc clip)    Phải: Render Queue</text></g>
<g class="co"><rect class="bx" x="60" y="106" width="200" height="334" rx="10"/><text class="t" x="160" y="132" text-anchor="middle">Render Settings</text><text class="s" x="160" y="156" text-anchor="middle">Preset (menu thả xuống)</text><text class="s" x="160" y="176" text-anchor="middle">File Name · Location</text><text class="s" x="160" y="196" text-anchor="middle">Preset: một danh sách gọn</text></g>
<g class="co"><rect class="bx" x="72" y="212" width="176" height="150" rx="6"/><text class="t" x="160" y="244" text-anchor="middle">Custom Export:</text><text class="s" x="160" y="258" text-anchor="middle">Single / Individual clips</text><text class="s" x="160" y="278" text-anchor="middle">Tab Video · Audio · File</text><text class="s" x="160" y="298" text-anchor="middle">Format, Codec, Quality</text><text class="s" x="160" y="318" text-anchor="middle">Advanced Settings</text><text class="s" x="160" y="338" text-anchor="middle">Subtitle Settings</text></g>
<g class="co"><rect class="bx" x="72" y="376" width="176" height="50" rx="6"/><text class="s" x="160" y="396" text-anchor="middle">Estimated File Size</text><text class="s" x="160" y="414" text-anchor="middle">nút Add to Render Queue</text></g>
<g class="tl"><rect class="bx" x="276" y="106" width="210" height="160" rx="10"/><text class="t" x="381" y="160" text-anchor="middle">Viewer</text><text class="s" x="381" y="184" text-anchor="middle">Chọn timeline ở đầu Viewer</text><text class="s" x="381" y="204" text-anchor="middle">IN · OUT · DURATION</text><text class="s" x="381" y="224" text-anchor="middle">Phát, tua, bật tắt tiếng</text></g>
<g class="pu"><rect class="bx" x="502" y="106" width="118" height="160" rx="10"/><text class="t" x="561" y="160" text-anchor="middle">Render Queue</text><text class="s" x="561" y="184" text-anchor="middle">Danh sách job</text><text class="s" x="561" y="214" text-anchor="middle">Nút Render All</text><text class="s" x="561" y="232" text-anchor="middle">hoặc Render 1</text></g>
<g class="tl"><rect class="bx" x="276" y="282" width="344" height="60" rx="10"/><text class="t" x="448" y="306" text-anchor="middle">Thumbnail timeline</text><text class="s" x="448" y="326" text-anchor="middle">Mỗi clip một ô, ghi codec — ẩn hiện bằng nút Clips</text></g>
<g class="tl"><rect class="bx" x="276" y="358" width="344" height="82" rx="10"/><text class="t" x="448" y="384" text-anchor="middle">Timeline</text><text class="s" x="448" y="404" text-anchor="middle">Menu Render: Entire Timeline / In/Out Range</text><text class="s" x="448" y="422" text-anchor="middle">Đặt I O, tắt track không muốn xuất</text></g>
</svg>
