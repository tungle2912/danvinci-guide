<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img"><title>Sửa lỗi Media Offline theo chỗ file gốc đang nằm</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="co"><rect class="bx" x="190" y="20" width="300" height="48" rx="8"/><text class="t" x="340" y="49" text-anchor="middle">Clip đỏ, báo Media Offline</text></g>
<path class="ar" d="M340 68 L340 96" marker-end="url(#a)"/>
<g class="gy"><rect class="bx" x="165" y="100" width="350" height="56" rx="8"/><text class="t" x="340" y="123" text-anchor="middle">File gốc giờ ở đâu?</text><text class="s" x="340" y="143" text-anchor="middle">Resolve chỉ lưu đường dẫn, không chép file</text></g>
<path class="ar" d="M340 156 L340 176 L120 176 L120 196" marker-end="url(#a)"/>
<path class="ar" d="M340 156 L340 176 L340 176 L340 196" marker-end="url(#a)"/>
<path class="ar" d="M340 156 L340 176 L560 176 L560 196" marker-end="url(#a)"/>
<g class="gy"><rect class="bx" x="15" y="200" width="210" height="56" rx="8"/><text class="t" x="120" y="223" text-anchor="middle">Ổ ngoài chưa cắm</text><text class="s" x="120" y="243" text-anchor="middle">Hoặc ổ đã đổi tên</text></g>
<g class="gy"><rect class="bx" x="235" y="200" width="210" height="56" rx="8"/><text class="t" x="340" y="223" text-anchor="middle">Đã chuyển thư mục</text><text class="s" x="340" y="243" text-anchor="middle">Tên file giữ nguyên</text></g>
<g class="gy"><rect class="bx" x="455" y="200" width="210" height="56" rx="8"/><text class="t" x="560" y="223" text-anchor="middle">Đã đổi tên file</text><text class="s" x="560" y="243" text-anchor="middle">Tên khác lúc nạp</text></g>
<path class="ar" d="M120 256 L120 296" marker-end="url(#a)"/>
<path class="ar" d="M340 256 L340 296" marker-end="url(#a)"/>
<path class="ar" d="M560 256 L560 296" marker-end="url(#a)"/>
<g class="tl"><rect class="bx" x="15" y="300" width="210" height="56" rx="8"/><text class="t" x="120" y="323" text-anchor="middle">Cắm lại ổ</text><text class="s" x="120" y="343" text-anchor="middle">Còn đỏ: Relink Selected Clips</text></g>
<g class="tl"><rect class="bx" x="235" y="300" width="210" height="56" rx="8"/><text class="t" x="340" y="323" text-anchor="middle">Relink Selected Clips</text><text class="s" x="340" y="343" text-anchor="middle">Chuột phải clip hoặc bin</text></g>
<g class="tl"><rect class="bx" x="455" y="300" width="210" height="56" rx="8"/><text class="t" x="560" y="323" text-anchor="middle">Đổi lại tên cũ</text><text class="s" x="560" y="343" text-anchor="middle">Rồi Relink Selected Clips</text></g>
<g class="gy"><text class="s" x="340" y="394" text-anchor="middle">Relink dò theo tên file và timecode, kể cả thư mục con (manual tr. 416).</text></g>
<g class="gy"><text class="s" x="340" y="416" text-anchor="middle">Nút Relink Media sáng cam trong Media Pool trang Cut, Edit (tr. 415).</text></g>
</svg>
