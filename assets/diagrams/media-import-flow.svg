<g class="pu"><rect class="bx" x="413" y="30" width="116" height="70" rx="8"/><text class="t" x="471" y="61" text-anchor="middle">4 Metadata</text><text class="s" x="471" y="79" text-anchor="middle">Keyword, sao</text></g>
<g class="pu"><rect class="bx" x="544" y="30" width="116" height="70" rx="8"/><text class="t" x="602" y="61" text-anchor="middle">5 Attributes</text><text class="s" x="602" y="79" text-anchor="middle">Sửa fps, tiếng</text></g>
<line class="ar" x1="136" y1="65" x2="149" y2="65" marker-end="url(#a)"/>
<line class="ar" x1="267" y1="65" x2="280" y2="65" marker-end="url(#a)"/>
