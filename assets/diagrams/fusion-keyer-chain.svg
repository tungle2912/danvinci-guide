<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img"><title>Chuỗi node tách phông xanh bằng Delta Keyer rồi ghép lên nền mới</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gy"><rect class="bx" x="20" y="120" width="120" height="56" rx="8"/><text class="t" x="80" y="144" text-anchor="middle">MediaIn1</text><text class="s" x="80" y="162" text-anchor="middle">Phông xanh</text></g>
<g class="pu"><rect class="bx" x="180" y="120" width="140" height="56" rx="8"/><text class="t" x="250" y="144" text-anchor="middle">DeltaKeyer1</text><text class="s" x="250" y="162" text-anchor="middle">Tách phông → alpha</text></g>
<g class="gy"><rect class="bx" x="410" y="20" width="130" height="50" rx="8"/><text class="t" x="475" y="41" text-anchor="middle">MediaIn2</text><text class="s" x="475" y="59" text-anchor="middle">Nền mới</text></g>
<g class="tl"><rect class="bx" x="420" y="120" width="110" height="56" rx="8"/><text class="t" x="475" y="144" text-anchor="middle">Merge1</text><text class="s" x="475" y="162" text-anchor="middle">Người lên nền</text></g>
<g class="gy"><rect class="bx" x="560" y="120" width="100" height="56" rx="8"/><text class="t" x="610" y="153" text-anchor="middle">MediaOut1</text></g>
<g class="gy"><rect class="bx" x="180" y="226" width="140" height="70" rx="8"/><text class="t" x="250" y="248" text-anchor="middle">Polygon1</text><text class="s" x="250" y="266" text-anchor="middle">Vẽ quanh người</text><text class="s" x="250" y="284" text-anchor="middle">nhớ bật Invert</text></g>
<line class="ar" x1="140" y1="148" x2="178" y2="148" marker-end="url(#a)"/>
<line class="ar" x1="320" y1="148" x2="418" y2="148" marker-end="url(#a)"/>
<line class="ar" x1="475" y1="70" x2="475" y2="118" marker-end="url(#a)"/>
<line class="ar" x1="530" y1="148" x2="558" y2="148" marker-end="url(#a)"/>
<line class="ar" x1="250" y1="226" x2="250" y2="178" marker-end="url(#a)"/>
<g class="tl"><rect class="bx" x="328" y="124" width="81" height="18" rx="9"/><text class="s" x="368.5" y="137" text-anchor="middle">Foreground</text></g>
<g class="co"><rect class="bx" x="485" y="84" width="126.5" height="18" rx="9"/><text class="s" x="548.25" y="97" text-anchor="middle">Background · vàng</text></g>
<g class="gy"><rect class="bx" x="260" y="194" width="139.5" height="18" rx="9"/><text class="s" x="329.75" y="207" text-anchor="middle">Garbage Matte · xám</text></g>
<g class="gy"><text class="s" x="20" y="326">Không cần nền mới? Chỉ cần MediaIn1 → DeltaKeyer1 → MediaOut1, alpha tự về timeline.</text></g>
</svg>
