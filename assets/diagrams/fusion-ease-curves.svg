<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" role="img"><title>Ba kiểu nội suy keyframe: Linear, Smooth, Step In</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gy"><rect class="bx" x="20" y="16" width="200" height="240" rx="10"/></g>
<g class="gy"><text class="t" x="120" y="42" text-anchor="middle">Linear</text></g>
<g class="gy"><text class="s" x="120" y="62" text-anchor="middle">Đi đều</text></g>
<line class="ar" x1="40" y1="206" x2="206" y2="206" marker-end="url(#a)"/>
<line class="ar" x1="40" y1="206" x2="40" y2="76" marker-end="url(#a)"/>
<path d="M54 196 L192 92" fill="none" stroke="#534AB7" stroke-width="2"/>
<g class="pu"><circle class="bx" cx="54" cy="196" r="5"/></g>
<g class="pu"><circle class="bx" cx="192" cy="92" r="5"/></g>
<g class="gy"><text class="s" x="54" y="224" text-anchor="middle">khung 0</text></g>
<g class="gy"><text class="s" x="180" y="224" text-anchor="middle">khung 30</text></g>
<g class="gy"><text class="s" x="120" y="246" text-anchor="middle">⇧L — tốc độ không đổi</text></g>
<g class="gy"><rect class="bx" x="240" y="16" width="200" height="240" rx="10"/></g>
<g class="gy"><text class="t" x="340" y="42" text-anchor="middle">Smooth</text></g>
<g class="gy"><text class="s" x="340" y="62" text-anchor="middle">Chậm dần ở hai đầu</text></g>
<line class="ar" x1="260" y1="206" x2="426" y2="206" marker-end="url(#a)"/>
<line class="ar" x1="260" y1="206" x2="260" y2="76" marker-end="url(#a)"/>
<path d="M274 196 C354 196 332 92 412 92" fill="none" stroke="#534AB7" stroke-width="2"/>
<g class="pu"><circle class="bx" cx="274" cy="196" r="5"/></g>
<g class="pu"><circle class="bx" cx="412" cy="92" r="5"/></g>
<g class="gy"><text class="s" x="274" y="224" text-anchor="middle">khung 0</text></g>
<g class="gy"><text class="s" x="400" y="224" text-anchor="middle">khung 30</text></g>
<g class="gy"><text class="s" x="340" y="246" text-anchor="middle">⇧S — mượt khi qua keyframe</text></g>
<g class="gy"><rect class="bx" x="460" y="16" width="200" height="240" rx="10"/></g>
<g class="gy"><text class="t" x="560" y="42" text-anchor="middle">Step In</text></g>
<g class="gy"><text class="s" x="560" y="62" text-anchor="middle">Giữ nguyên rồi nhảy</text></g>
<line class="ar" x1="480" y1="206" x2="646" y2="206" marker-end="url(#a)"/>
<line class="ar" x1="480" y1="206" x2="480" y2="76" marker-end="url(#a)"/>
<path d="M494 196 H632 V92" fill="none" stroke="#534AB7" stroke-width="2"/>
<g class="pu"><circle class="bx" cx="494" cy="196" r="5"/></g>
<g class="pu"><circle class="bx" cx="632" cy="92" r="5"/></g>
<g class="gy"><text class="s" x="494" y="224" text-anchor="middle">khung 0</text></g>
<g class="gy"><text class="s" x="620" y="224" text-anchor="middle">khung 30</text></g>
<g class="gy"><text class="s" x="560" y="246" text-anchor="middle">I — không có chuyển tiếp</text></g>
</svg>
