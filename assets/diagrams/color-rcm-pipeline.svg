<svg xmlns="http://www.w3.org/2000/svg" width="680" height="288" viewBox="0 0 680 288" role="img"><title>Đường đi của màu khi bật Color Managed</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gy"><text stroke="none" class="s" x="8" y="26">Project Settings → Color Management → DaVinci YRGB Color Managed</text></g>
<g class="tl"><rect class="bx" x="8" y="44" width="148" height="92" rx="8"/>
<text stroke="none" class="t" x="82" y="75" text-anchor="middle">1. Clip nguồn</text>
<text stroke="none" class="s" x="82" y="95" text-anchor="middle">Input Color Space</text>
<text stroke="none" class="s" x="82" y="115" text-anchor="middle">riêng từng clip</text>
</g>
<g class="pu"><rect class="bx" x="180" y="44" width="148" height="92" rx="8"/>
<text stroke="none" class="t" x="254" y="75" text-anchor="middle">2. Bạn chỉnh màu</text>
<text stroke="none" class="s" x="254" y="95" text-anchor="middle">Timeline Color Space</text>
<text stroke="none" class="s" x="254" y="115" text-anchor="middle">node làm việc ở đây</text>
</g>
<g class="tl"><rect class="bx" x="352" y="44" width="148" height="92" rx="8"/>
<text stroke="none" class="t" x="426" y="75" text-anchor="middle">3. Đầu ra</text>
<text stroke="none" class="s" x="426" y="95" text-anchor="middle">Output Color Space</text>
<text stroke="none" class="s" x="426" y="115" text-anchor="middle">vd Rec.709 g2.4</text>
</g>
<g class="gy"><rect class="bx" x="524" y="44" width="148" height="92" rx="8"/>
<text stroke="none" class="t" x="598" y="75" text-anchor="middle">4. Xem và xuất</text>
<text stroke="none" class="s" x="598" y="95" text-anchor="middle">Viewer, màn hình</text>
<text stroke="none" class="s" x="598" y="115" text-anchor="middle">file render</text>
</g>
<path class="ar" d="M158 90.0 L178 90.0" marker-end="url(#a)"/>
<path class="ar" d="M330 90.0 L350 90.0" marker-end="url(#a)"/>
<path class="ar" d="M502 90.0 L522 90.0" marker-end="url(#a)"/>
<g class="tl"><rect class="bx" x="8" y="160" width="320" height="56" rx="8"/>
<text stroke="none" class="s" x="168" y="183" text-anchor="middle">1 → 2: Resolve tự chuyển, không cắt</text>
<text stroke="none" class="s" x="168" y="203" text-anchor="middle">dữ liệu sáng tối của file LOG</text>
</g>
<g class="co"><rect class="bx" x="352" y="160" width="320" height="56" rx="8"/>
<text stroke="none" class="s" x="512" y="183" text-anchor="middle">2 → 3: phần vượt khỏi Output bị cắt</text>
<text stroke="none" class="s" x="512" y="203" text-anchor="middle">(trừ khi bật Gamut Mapping)</text>
</g>
<g class="co"><rect class="bx" x="8" y="232" width="664" height="40" rx="8"/>
<text stroke="none" class="s" x="340" y="257" text-anchor="middle">Đã bật Color Managed thì đừng thêm CST hay LUT chuyển đổi ở node — ảnh bị chuyển hai lần</text>
</g>
</svg>
