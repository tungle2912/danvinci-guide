<svg xmlns="http://www.w3.org/2000/svg" width="680" height="200" viewBox="0 0 680 200" role="img"><title>Sáu nút edit dưới đáy Media Pool trang Cut</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gy"><rect class="bx" x="30" y="30" width="620" height="140" rx="14"/></g>
<g class="tl"><rect class="bx" x="45" y="50" width="92" height="100" rx="8"/><text class="t" x="91" y="85" text-anchor="middle">1</text><text class="s" x="91" y="108" text-anchor="middle">Smart</text><text class="s" x="91" y="124" text-anchor="middle">Insert</text></g>
<g class="tl"><rect class="bx" x="146" y="50" width="92" height="100" rx="8"/><text class="t" x="192" y="85" text-anchor="middle">2</text><text class="s" x="192" y="108" text-anchor="middle">Append</text></g>
<g class="pu"><rect class="bx" x="247" y="50" width="92" height="100" rx="8"/><text class="t" x="293" y="85" text-anchor="middle">3</text><text class="s" x="293" y="108" text-anchor="middle">Ripple</text><text class="s" x="293" y="124" text-anchor="middle">Overwrite</text></g>
<g class="pu"><rect class="bx" x="348" y="50" width="92" height="100" rx="8"/><text class="t" x="394" y="85" text-anchor="middle">4</text><text class="s" x="394" y="108" text-anchor="middle">Close Up</text></g>
<g class="co"><rect class="bx" x="449" y="50" width="92" height="100" rx="8"/><text class="t" x="495" y="85" text-anchor="middle">5</text><text class="s" x="495" y="108" text-anchor="middle">Place</text><text class="s" x="495" y="124" text-anchor="middle">On Top</text></g>
<g class="co"><rect class="bx" x="550" y="50" width="92" height="100" rx="8"/><text class="t" x="596" y="85" text-anchor="middle">6</text><text class="s" x="596" y="108" text-anchor="middle">Source</text><text class="s" x="596" y="124" text-anchor="middle">Overwrite</text></g>
</svg>
