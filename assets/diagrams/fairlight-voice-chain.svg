<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" role="img"><title>Chuỗi xử lý giọng nói trên một track, kèm giá trị khởi đầu</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="tl"><rect class="bx" x="25" y="40" width="190" height="84" rx="8"/><text class="t" x="120" y="68" text-anchor="middle">1 · Dialogue Leveler</text><text class="s" x="120" y="88" text-anchor="middle">Track FX · giọng đều</text><text class="s" x="120" y="106" text-anchor="middle">Lift Soft Dialogue</text></g>
<g class="co"><rect class="bx" x="245" y="40" width="190" height="84" rx="8"/><text class="t" x="340" y="68" text-anchor="middle">2 · Noise Reduction</text><text class="s" x="340" y="88" text-anchor="middle">Effects ô 1 · De-Hiss</text><text class="s" x="340" y="106" text-anchor="middle">Dry/Wet 70–100%</text></g>
<g class="co"><rect class="bx" x="465" y="40" width="190" height="84" rx="8"/><text class="t" x="560" y="68" text-anchor="middle">3 · De-Esser</text><text class="s" x="560" y="88" text-anchor="middle">Effects ô 2 · 5–8 kHz</text><text class="s" x="560" y="106" text-anchor="middle">Amount vừa hết chói</text></g>
<line class="ar" x1="217" y1="82" x2="241" y2="82" marker-end="url(#a)"/>
<line class="ar" x1="437" y1="82" x2="461" y2="82" marker-end="url(#a)"/>
<g class="pu"><rect class="bx" x="25" y="170" width="190" height="84" rx="8"/><text class="t" x="120" y="198" text-anchor="middle">4 · Compressor</text><text class="s" x="120" y="218" text-anchor="middle">Dynamics · Ratio 2.5–3:1</text><text class="s" x="120" y="236" text-anchor="middle">Chỉ nén chỗ to nhất</text></g>
<g class="pu"><rect class="bx" x="245" y="170" width="190" height="84" rx="8"/><text class="t" x="340" y="198" text-anchor="middle">5 · EQ</text><text class="s" x="340" y="218" text-anchor="middle">Hi-Pass 80 Hz</text><text class="s" x="340" y="236" text-anchor="middle">−2 dB 300 Hz, +2 dB 4 kHz</text></g>
<g class="tl"><rect class="bx" x="465" y="170" width="190" height="84" rx="8"/><text class="t" x="560" y="198" text-anchor="middle">6 · Limiter</text><text class="s" x="560" y="218" text-anchor="middle">Bus 1 · Ceiling −1 dB</text><text class="s" x="560" y="236" text-anchor="middle">Chặn trần cả bản mix</text></g>
<line class="ar" x1="217" y1="212" x2="241" y2="212" marker-end="url(#a)"/>
<line class="ar" x1="437" y1="212" x2="461" y2="212" marker-end="url(#a)"/>
<path class="ar" d="M560 126 L560 148 L120 148 L120 162" marker-end="url(#a)"/>
<g class="tl"><text class="s" x="340" y="284" text-anchor="middle">Thứ tự 1–5 trùng thứ tự mặc định của cột Mixer: Track FX → Effects → Dynamics → EQ</text></g>
<g class="tl"><text class="s" x="340" y="304" text-anchor="middle">Con số là điểm xuất phát. Nghe bằng tai nghe rồi chỉnh tiếp</text></g>
</svg>
