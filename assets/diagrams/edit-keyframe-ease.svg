<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" viewBox="0 0 680 260" role="img"><title>Đường keyframe Linear so với Ease In and Out</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gy"><rect class="bx" x="16" y="16" width="316" height="228" rx="8"/>
</g>
<g class="gy"><text class="t" x="28" y="40" text-anchor="start">Linear</text></g>
<line class="ar" x1="56" y1="178" x2="306" y2="178" marker-end="url(#a)"/>
<line class="ar" x1="56" y1="178" x2="56" y2="56" marker-end="url(#a)"/>
<g class="gy"><text class="s" x="306" y="194" text-anchor="end">thời gian</text></g>
<g class="gy"><text class="s" x="62" y="64" text-anchor="start">giá trị</text></g>
<path class="ar" d="M76 158 L276 78" style="stroke:#534AB7;stroke-width:2"/>
<g class="co"><rect class="bx" x="70" y="152" width="12" height="12" transform="rotate(45 76 158)"/></g>
<g class="co"><rect class="bx" x="270" y="72" width="12" height="12" transform="rotate(45 276 78)"/></g>
<g class="gy"><text class="s" x="28" y="214" text-anchor="start">Tốc độ đều từ đầu tới cuối,</text></g>
<g class="gy"><text class="s" x="28" y="232" text-anchor="start">khựng lúc bắt đầu và lúc dừng</text></g>
<g class="gy"><rect class="bx" x="348" y="16" width="316" height="228" rx="8"/>
</g>
<g class="gy"><text class="t" x="360" y="40" text-anchor="start">Ease In and Out</text></g>
<line class="ar" x1="388" y1="178" x2="638" y2="178" marker-end="url(#a)"/>
<line class="ar" x1="388" y1="178" x2="388" y2="56" marker-end="url(#a)"/>
<g class="gy"><text class="s" x="638" y="194" text-anchor="end">thời gian</text></g>
<g class="gy"><text class="s" x="394" y="64" text-anchor="start">giá trị</text></g>
<path class="ar" d="M408 158 C518 158 498 78 608 78" style="stroke:#0F6E56;stroke-width:2"/>
<path class="ar" d="M408 158 L478 158" style="stroke:#888780;stroke-width:1"/>
<path class="ar" d="M608 78 L538 78" style="stroke:#888780;stroke-width:1"/>
<g class="gy"><circle cx="478" cy="158" r="3"/><circle cx="538" cy="78" r="3"/></g>
<g class="co"><rect class="bx" x="402" y="152" width="12" height="12" transform="rotate(45 408 158)"/></g>
<g class="co"><rect class="bx" x="602" y="72" width="12" height="12" transform="rotate(45 608 78)"/></g>
<g class="gy"><text class="s" x="360" y="214" text-anchor="start">Chậm lúc rời keyframe đầu, nhanh ở giữa,</text></g>
<g class="gy"><text class="s" x="360" y="232" text-anchor="start">chậm dần khi tới keyframe sau</text></g>
</svg>
