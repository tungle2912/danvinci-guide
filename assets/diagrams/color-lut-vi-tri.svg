<svg xmlns="http://www.w3.org/2000/svg" width="680" height="348" viewBox="0 0 680 348" role="img"><title>Vị trí đặt LUT trong chuỗi node</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="tl"><text stroke="none" class="s" x="72" y="40" text-anchor="middle">Đầu chuỗi</text></g>
<g class="pu"><text stroke="none" class="s" x="608" y="40" text-anchor="middle">Sau khi đã cân bằng</text></g>
<g class="tl"><rect class="bx" x="10" y="56" width="124" height="64" rx="8"/>
<text stroke="none" class="t" x="72" y="83" text-anchor="middle">LUT kỹ thuật</text>
<text stroke="none" class="s" x="72" y="103" text-anchor="middle">LOG → Rec.709</text>
</g>
<g class="gy"><rect class="bx" x="144" y="56" width="124" height="64" rx="8"/>
<text stroke="none" class="t" x="206" y="83" text-anchor="middle">Cân bằng</text>
<text stroke="none" class="s" x="206" y="103" text-anchor="middle">Primaries</text>
</g>
<g class="gy"><rect class="bx" x="278" y="56" width="124" height="64" rx="8"/>
<text stroke="none" class="t" x="340" y="83" text-anchor="middle">Chỉnh màu</text>
<text stroke="none" class="s" x="340" y="103" text-anchor="middle">Curves, da, trời</text>
</g>
<g class="pu"><rect class="bx" x="412" y="56" width="124" height="64" rx="8"/>
<text stroke="none" class="t" x="474" y="83" text-anchor="middle">LUT sáng tạo</text>
<text stroke="none" class="s" x="474" y="103" text-anchor="middle">look, tông phim</text>
</g>
<g class="gy"><rect class="bx" x="546" y="56" width="124" height="64" rx="8"/>
<text stroke="none" class="t" x="608" y="83" text-anchor="middle">Hoàn thiện</text>
<text stroke="none" class="s" x="608" y="103" text-anchor="middle">vignette, nét</text>
</g>
<path class="ar" d="M135 88.0 L143 88.0" marker-end="url(#a)"/>
<path class="ar" d="M269 88.0 L277 88.0" marker-end="url(#a)"/>
<path class="ar" d="M403 88.0 L411 88.0" marker-end="url(#a)"/>
<path class="ar" d="M537 88.0 L545 88.0" marker-end="url(#a)"/>
<g class="co"><rect class="bx" x="10" y="136" width="258" height="40" rx="8"/>
<text stroke="none" class="s" x="139" y="161" text-anchor="middle">Look đặt trước khi cân bằng = màu sai</text>
</g>
<g class="gy"><text stroke="none" class="t" x="10" y="214">Bên trong một node</text></g>
<g class="gy"><rect class="bx" x="10" y="226" width="660" height="80" rx="10"/></g>
<g class="gy"><rect class="bx" x="26" y="240" width="420" height="52" rx="8"/>
<text stroke="none" class="t" x="236" y="261" text-anchor="middle">Mọi chỉnh sửa khác của node</text>
<text stroke="none" class="s" x="236" y="281" text-anchor="middle">Primaries, Curves, Qualifier, Window…</text>
</g>
<path class="ar" d="M448 266 L482 266" marker-end="url(#a)"/>
<g class="pu"><rect class="bx" x="486" y="240" width="168" height="52" rx="8"/>
<text stroke="none" class="t" x="570" y="261" text-anchor="middle">LUT của node</text>
<text stroke="none" class="s" x="570" y="281" text-anchor="middle">luôn áp cuối cùng</text>
</g>
<g class="tl"><text stroke="none" class="s" x="10" y="332">Mẹo: LUT làm cháy sáng → hạ Gain ngay trong node đó, ảnh được hạ trước khi vào LUT</text></g>
</svg>
