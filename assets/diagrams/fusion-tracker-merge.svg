<g class="co"><rect class="bx" x="164" y="153" width="81" height="18" rx="9"/><text class="s" x="204.5" y="166" text-anchor="middle">Background</text></g>
<line x1="16" y1="196" x2="664" y2="196" stroke="#D3D1C7" stroke-width="1"/>
<g class="gy"><text class="t" x="20" y="224">Cách B — Tracker đứng riêng, chỉ cho dữ liệu</text></g>
<g class="pu"><rect class="bx" x="210" y="240" width="130" height="50" rx="8"/><text class="t" x="275" y="261" text-anchor="middle">Tracker1</text><text class="s" x="275" y="279" text-anchor="middle">Chỉ phân tích</text></g>
<g class="gy"><rect class="bx" x="30" y="306" width="130" height="50" rx="8"/><text class="t" x="95" y="327" text-anchor="middle">MediaIn1</text><text class="s" x="95" y="345" text-anchor="middle">Clip có vật chạy</text></g>
<g class="tl"><rect class="bx" x="380" y="306" width="120" height="50" rx="8"/><text class="t" x="440" y="336" text-anchor="middle">Merge1</text></g>
<g class="gy"><rect class="bx" x="530" y="306" width="120" height="50" rx="8"/><text class="t" x="590" y="336" text-anchor="middle">MediaOut1</text></g>
