<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img"><title>So sánh proxy, optimized media và render cache trong DaVinci Resolve</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gy"><rect class="bx" x="220" y="20" width="240" height="56" rx="8"/><text class="t" x="340" y="44" text-anchor="middle" stroke="none">File gốc trên ổ</text><text class="s" x="340" y="62" text-anchor="middle" stroke="none">Ví dụ: clip 4K LOG H.265</text></g>
<path class="ar" d="M300 76 L120 120" marker-end="url(#a)"/>
<line class="ar" x1="340" y1="76" x2="340" y2="120" marker-end="url(#a)"/>
<path class="ar" d="M380 76 L560 120" marker-end="url(#a)"/>
<g class="pu"><rect class="bx" x="20" y="122" width="200" height="140" rx="8"/><text class="t" x="120" y="161" text-anchor="middle">Proxy</text><text class="s" x="120" y="179" text-anchor="middle">Generate Proxy Media</text><text class="s" x="120" y="197" text-anchor="middle">File .mov nhẹ, mang đi được</text><text class="s" x="120" y="215" text-anchor="middle">Playback → Proxy Handling</text><text class="s" x="120" y="233" text-anchor="middle">Hợp: dựng trên máy khác</text></g>
<g class="tl"><rect class="bx" x="240" y="122" width="200" height="140" rx="8"/><text class="t" x="340" y="161" text-anchor="middle">Optimized Media</text><text class="s" x="340" y="179" text-anchor="middle">Generate Optimized Media</text><text class="s" x="340" y="197" text-anchor="middle">File .dvcc trong cache</text><text class="s" x="340" y="215" text-anchor="middle">Use Optimized Media if…</text><text class="s" x="340" y="233" text-anchor="middle">Hợp: dựng mượt máy này</text></g>
<g class="co"><rect class="bx" x="460" y="122" width="200" height="140" rx="8"/><text class="t" x="560" y="161" text-anchor="middle">Render Cache</text><text class="s" x="560" y="179" text-anchor="middle">Playback → Render Cache</text><text class="s" x="560" y="197" text-anchor="middle">Lưu sẵn đoạn nặng hiệu ứng</text><text class="s" x="560" y="215" text-anchor="middle">Off · Smart · User</text><text class="s" x="560" y="233" text-anchor="middle">Hợp: màu, Fusion nặng</text></g>
<g class="gy"><rect class="bx" x="20" y="278" width="640" height="36" rx="8"/><text class="s" x="340" y="300" text-anchor="middle" stroke="none">Cả ba là file phụ, không sửa file gốc. Xoá file phụ thì Resolve quay về dùng file gốc</text></g>
</svg>
