<svg xmlns="http://www.w3.org/2000/svg" width="680" height="438" viewBox="0 0 680 438" role="img"><title>Độ to đích theo nền tảng, tính bằng LUFS</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="tl"><text class="t" x="20" y="26" text-anchor="start">Độ to đích (Integrated, LUFS). Thanh càng dài, bản mix càng to</text></g>
<g class="tl"><text class="t" x="20" y="61">YouTube</text><text class="s" x="20" y="78">manual ghi −14 LUFS</text><rect class="bx" x="250" y="50" width="304" height="24" rx="4"/><text class="s" x="562" y="67">−14</text></g>
<g class="co"><text class="t" x="20" y="107">TikTok, Reels, Shorts</text><text class="s" x="20" y="124">không công bố, dùng như YT</text><rect class="bx" x="250" y="96" width="304" height="24" rx="4"/><text class="s" x="562" y="113">≈ −14</text></g>
<g class="tl"><text class="t" x="20" y="153">Spotify</text><text class="s" x="20" y="170">đỉnh không quá −1 dBTP</text><rect class="bx" x="250" y="142" width="304" height="24" rx="4"/><text class="s" x="562" y="159">−14</text></g>
<g class="tl"><text class="t" x="20" y="199">Apple Podcasts</text><text class="s" x="20" y="216">±1 LU, đỉnh ≤ −1 dBTP</text><rect class="bx" x="250" y="188" width="266" height="24" rx="4"/><text class="s" x="524" y="205">−16</text></g>
<g class="pu"><text class="t" x="20" y="245">EBU R128</text><text class="s" x="20" y="262">TV châu Âu · mặc định Resolve</text><rect class="bx" x="250" y="234" width="133" height="24" rx="4"/><text class="s" x="391" y="251">−23</text></g>
<g class="pu"><text class="t" x="20" y="291">ATSC A/85</text><text class="s" x="20" y="308">TV Mỹ · đỉnh ≤ −2 dBTP</text><rect class="bx" x="250" y="280" width="114" height="24" rx="4"/><text class="s" x="372" y="297">−24</text></g>
<g class="pu"><text class="t" x="20" y="337">Netflix</text><text class="s" x="20" y="354">đo theo lời thoại, ±2 LU</text><rect class="bx" x="250" y="326" width="57" height="24" rx="4"/><text class="s" x="315" y="343">−27</text></g>
<g class="gy"><line x1="250" y1="374" x2="630" y2="374"/></g>
<g class="gy"><line x1="250" y1="374" x2="250" y2="380"/></g>
<g class="tl"><text class="s" x="250" y="396" text-anchor="middle">−30</text></g>
<g class="gy"><line x1="345" y1="374" x2="345" y2="380"/></g>
<g class="tl"><text class="s" x="345" y="396" text-anchor="middle">−25</text></g>
<g class="gy"><line x1="440" y1="374" x2="440" y2="380"/></g>
<g class="tl"><text class="s" x="440" y="396" text-anchor="middle">−20</text></g>
<g class="gy"><line x1="535" y1="374" x2="535" y2="380"/></g>
<g class="tl"><text class="s" x="535" y="396" text-anchor="middle">−15</text></g>
<g class="gy"><line x1="630" y1="374" x2="630" y2="380"/></g>
<g class="tl"><text class="s" x="630" y="396" text-anchor="middle">−10</text></g>
<g class="tl"><text class="s" x="20" y="396" text-anchor="start">Thang LUFS</text></g>
<g class="co"><text class="s" x="20" y="424" text-anchor="start">Chỉ YouTube, EBU R128 (−23) và ATSC A/85 (−24) có trong manual. Các số khác theo tài liệu nền tảng</text></g>
</svg>
