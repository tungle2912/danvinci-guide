<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gy"><text class="t" x="20" y="30">Cách A — Tracker kiêm luôn Merge</text></g>
<g class="gy"><rect class="bx" x="30" y="46" width="130" height="50" rx="8"/><text class="t" x="95" y="67" text-anchor="middle">TieuDe</text><text class="s" x="95" y="85" text-anchor="middle">Text+</text></g>
<g class="gy"><rect class="bx" x="30" y="122" width="130" height="50" rx="8"/><text class="t" x="95" y="143" text-anchor="middle">MediaIn1</text><text class="s" x="95" y="161" text-anchor="middle">Clip có vật chạy</text></g>
<g class="tl"><rect class="bx" x="250" y="92" width="190" height="60" rx="8"/><text class="t" x="345" y="118" text-anchor="middle">Tracker1</text><text class="s" x="345" y="136" text-anchor="middle">Match Move · FG Over BG</text></g>
<g class="gy"><rect class="bx" x="510" y="97" width="130" height="50" rx="8"/><text class="t" x="575" y="127" text-anchor="middle">MediaOut1</text></g>
