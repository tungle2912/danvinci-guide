<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img"><title>Tám trang của DaVinci Resolve 21 theo thứ tự trên thanh trang</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gy"><rect class="bx" x="50" y="50" width="130" height="60" rx="8"/><text class="t" x="115" y="77" text-anchor="middle">Media</text><text class="s" x="115" y="97" text-anchor="middle">Nạp, sắp xếp</text></g>
<g class="co"><rect class="bx" x="200" y="50" width="130" height="60" rx="8"/><text class="t" x="265" y="77" text-anchor="middle">Photo</text><text class="s" x="265" y="97" text-anchor="middle">Chỉnh ảnh tĩnh</text></g>
<g class="tl"><rect class="bx" x="350" y="50" width="130" height="60" rx="8"/><text class="t" x="415" y="77" text-anchor="middle">Cut</text><text class="s" x="415" y="97" text-anchor="middle">Dựng nhanh</text></g>
<g class="tl"><rect class="bx" x="500" y="50" width="130" height="60" rx="8"/><text class="t" x="565" y="77" text-anchor="middle">Edit</text><text class="s" x="565" y="97" text-anchor="middle">Dựng chi tiết</text></g>
<g class="tl"><rect class="bx" x="50" y="170" width="130" height="60" rx="8"/><text class="t" x="115" y="197" text-anchor="middle">Fusion</text><text class="s" x="115" y="217" text-anchor="middle">VFX, chữ động</text></g>
<g class="tl"><rect class="bx" x="200" y="170" width="130" height="60" rx="8"/><text class="t" x="265" y="197" text-anchor="middle">Color</text><text class="s" x="265" y="217" text-anchor="middle">Chỉnh màu</text></g>
<g class="tl"><rect class="bx" x="350" y="170" width="130" height="60" rx="8"/><text class="t" x="415" y="197" text-anchor="middle">Fairlight</text><text class="s" x="415" y="217" text-anchor="middle">Âm thanh</text></g>
<g class="gy"><rect class="bx" x="500" y="170" width="130" height="60" rx="8"/><text class="t" x="565" y="197" text-anchor="middle">Deliver</text><text class="s" x="565" y="217" text-anchor="middle">Xuất file</text></g>
<line class="ar" x1="182" y1="80" x2="195" y2="80" marker-end="url(#a)"/>
<line class="ar" x1="332" y1="80" x2="345" y2="80" marker-end="url(#a)"/>
<line class="ar" x1="482" y1="80" x2="495" y2="80" marker-end="url(#a)"/>
<path class="ar" d="M565 112 L565 140 L115 140 L115 160" marker-end="url(#a)"/>
<line class="ar" x1="182" y1="200" x2="195" y2="200" marker-end="url(#a)"/>
<line class="ar" x1="332" y1="200" x2="345" y2="200" marker-end="url(#a)"/>
<line class="ar" x1="482" y1="200" x2="495" y2="200" marker-end="url(#a)"/>
<g class="gy"><text class="s" x="340" y="268" text-anchor="middle">Thứ tự giống dãy icon ở đáy cửa sổ. Photo là luồng riêng cho ảnh tĩnh, bên cạnh luồng video.</text></g>
</svg>
