<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img"><title>Clone Tool copy một nguồn ra nhiều ổ đích và kiểm tra bằng checksum</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="co"><rect class="bx" x="20" y="96" width="150" height="72" rx="8"/><text class="t" x="95" y="128" text-anchor="middle">Nguồn</text><text class="s" x="95" y="146" text-anchor="middle">Thẻ nhớ A001</text></g>
<line class="ar" x1="170" y1="132" x2="218" y2="132" marker-end="url(#a)"/>
<g class="pu"><rect class="bx" x="220" y="86" width="200" height="92" rx="8"/><text class="t" x="320" y="119" text-anchor="middle">Clone Tool</text><text class="s" x="320" y="137" text-anchor="middle">Copy giữ cấu trúc</text><text class="s" x="320" y="155" text-anchor="middle">So checksum: MD5 mặc định</text></g>
<path class="ar" d="M420 120 L488 70" marker-end="url(#a)"/>
<path class="ar" d="M420 144 L488 194" marker-end="url(#a)"/>
<g class="tl"><rect class="bx" x="490" y="30" width="170" height="80" rx="8"/><text class="t" x="575" y="57" text-anchor="middle">Đích 1: SSD</text><text class="s" x="575" y="75" text-anchor="middle">Bản copy để dựng</text><text class="s" x="575" y="93" text-anchor="middle">+ báo cáo checksum</text></g>
<g class="tl"><rect class="bx" x="490" y="154" width="170" height="80" rx="8"/><text class="t" x="575" y="181" text-anchor="middle">Đích 2: HDD</text><text class="s" x="575" y="199" text-anchor="middle">Bản backup</text><text class="s" x="575" y="217" text-anchor="middle">+ báo cáo checksum</text></g>
<g class="gy"><rect class="bx" x="20" y="250" width="640" height="34" rx="8"/><text class="s" x="340" y="271" text-anchor="middle" stroke="none">Báo cáo ghi ở gốc mỗi ổ đích. Clone xong, mở thử file rồi mới format thẻ</text></g>
</svg>
