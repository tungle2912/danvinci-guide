<svg xmlns="http://www.w3.org/2000/svg" width="680" height="216" viewBox="0 0 680 216" role="img"><title>Qualifier, Window, Tracker trong một node</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gy"><rect class="bx" x="20" y="20" width="145" height="80" rx="8"/><text stroke="none" class="t" x="92.5" y="46" text-anchor="middle">1. Node mới</text><text stroke="none" class="s" x="92.5" y="68" text-anchor="middle">⌥S trên chuỗi</text><text stroke="none" class="s" x="92.5" y="86" text-anchor="middle">một node, một việc</text></g>
<path class="ar" d="M165 60 L181 60" marker-end="url(#a)"/>
<g class="tl"><rect class="bx" x="185" y="20" width="145" height="80" rx="8"/><text stroke="none" class="t" x="257.5" y="46" text-anchor="middle">2. Qualifier</text><text stroke="none" class="s" x="257.5" y="68" text-anchor="middle">hút màu da</text><text stroke="none" class="s" x="257.5" y="86" text-anchor="middle">⇧H xem vùng chọn</text></g>
<path class="ar" d="M330 60 L346 60" marker-end="url(#a)"/>
<g class="pu"><rect class="bx" x="350" y="20" width="145" height="80" rx="8"/><text stroke="none" class="t" x="422.5" y="46" text-anchor="middle">3. Window</text><text stroke="none" class="s" x="422.5" y="68" text-anchor="middle">khoanh quanh mặt</text><text stroke="none" class="s" x="422.5" y="86" text-anchor="middle">loại tay, tường</text></g>
<path class="ar" d="M495 60 L511 60" marker-end="url(#a)"/>
<g class="co"><rect class="bx" x="515" y="20" width="145" height="80" rx="8"/><text stroke="none" class="t" x="587.5" y="46" text-anchor="middle">4. Tracker</text><text stroke="none" class="s" x="587.5" y="68" text-anchor="middle">⌘T bám theo mặt</text><text stroke="none" class="s" x="587.5" y="86" text-anchor="middle">khi người di chuyển</text></g>
<path class="ar" d="M257.5 100 L257.5 136" marker-end="url(#a)"/>
<path class="ar" d="M422.5 100 L422.5 136" marker-end="url(#a)"/>
<g class="gy"><rect class="bx" x="20" y="140" width="640" height="60" rx="10"/><text stroke="none" class="t" x="340" y="164" text-anchor="middle">Vùng chọn cuối = màu da VÀ nằm trong Window</text><text stroke="none" class="s" x="340" y="186" text-anchor="middle">Chỉnh Primaries ở node này: chỉ da trên mặt đổi, tay và tường cùng màu giữ nguyên</text></g>
</svg>
