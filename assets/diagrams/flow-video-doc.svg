<svg xmlns="http://www.w3.org/2000/svg" width="680" height="556" viewBox="0 0 680 556" role="img"><title>Hai tình huống làm video dọc: quay dọc sẵn, hoặc cắt bản dọc từ bản ngang, rồi bố cục và xuất</title>
<style>
.bx{stroke-width:1}
