<svg xmlns="http://www.w3.org/2000/svg" width="680" height="370" viewBox="0 0 680 370" role="img"><title>Vùng tác động của Lift, Gamma, Gain, Offset</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient></defs>
<g class="gy"><text stroke="none" class="s" x="340" y="18" text-anchor="middle">Đường càng cao = bánh xe tác động càng mạnh lên vùng đó</text></g>
<path d="M70 46 L610 46" stroke="#5F5E5A" stroke-width="2.5" stroke-dasharray="6 4" fill="none"/>
<g class="gy"><text stroke="none" class="s" x="340" y="38" text-anchor="middle">Offset — dời đều cả dải</text></g>
<path d="M70 80 C 250 95, 430 230, 610 250" stroke="#0F6E56" stroke-width="2.5" fill="none"/>
<path d="M70 250 C 190 250, 250 80, 340 80 C 430 80, 490 250, 610 250" stroke="#534AB7" stroke-width="2.5" fill="none"/>
<path d="M70 250 C 250 230, 430 95, 610 80" stroke="#993C1D" stroke-width="2.5" fill="none"/>
<g class="tl"><text stroke="none" class="t" x="74" y="72">Lift</text></g>
<g class="pu"><text stroke="none" class="t" x="340" y="72" text-anchor="middle">Gamma</text></g>
<g class="co"><text stroke="none" class="t" x="606" y="72" text-anchor="end">Gain</text></g>
<path d="M70 250 L610 250" stroke="#B4B2A9" stroke-width="1" fill="none"/>
<rect x="70" y="258" width="540" height="14" fill="url(#g)" stroke="#5F5E5A" stroke-width="1"/>
<g class="gy"><text stroke="none" class="s" x="70" y="290">0 · đen</text><text stroke="none" class="s" x="180" y="290" text-anchor="middle">Vùng tối</text><text stroke="none" class="s" x="340" y="290" text-anchor="middle">Trung gian</text><text stroke="none" class="s" x="500" y="290" text-anchor="middle">Vùng sáng</text><text stroke="none" class="s" x="610" y="290" text-anchor="end">1023 · trắng</text></g>
<g class="tl"><rect class="bx" x="22" y="306" width="150" height="50" rx="8"/><text stroke="none" class="t" x="97" y="326" text-anchor="middle">Lift</text><text stroke="none" class="s" x="97" y="344" text-anchor="middle">Điểm đen, vùng tối</text></g>
<g class="pu"><rect class="bx" x="184" y="306" width="150" height="50" rx="8"/><text stroke="none" class="t" x="259" y="326" text-anchor="middle">Gamma</text><text stroke="none" class="s" x="259" y="344" text-anchor="middle">Trung gian, da người</text></g>
<g class="co"><rect class="bx" x="346" y="306" width="150" height="50" rx="8"/><text stroke="none" class="t" x="421" y="326" text-anchor="middle">Gain</text><text stroke="none" class="s" x="421" y="344" text-anchor="middle">Điểm trắng, trời</text></g>
<g class="gy"><rect class="bx" x="508" y="306" width="150" height="50" rx="8"/><text stroke="none" class="t" x="583" y="326" text-anchor="middle">Offset</text><text stroke="none" class="s" x="583" y="344" text-anchor="middle">Dời đều cả dải</text></g>
</svg>
