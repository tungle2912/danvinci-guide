<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" role="img"><title>Chọn cách tăng tốc phát theo triệu chứng: Timeline Proxy, Render Cache, Optimized hay Proxy Media</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="co"><rect class="bx" x="190" y="20" width="300" height="48" rx="8"/><text class="t" x="340" y="49" text-anchor="middle">Timeline phát không mượt</text></g>
<path class="ar" d="M340 68 L340 88 L120 88 L120 106" marker-end="url(#a)"/>
<path class="ar" d="M340 68 L340 88 L340 88 L340 106" marker-end="url(#a)"/>
<path class="ar" d="M340 68 L340 88 L560 88 L560 106" marker-end="url(#a)"/>
<g class="gy"><rect class="bx" x="15" y="110" width="210" height="56" rx="8"/><text class="t" x="120" y="133" text-anchor="middle">Hơi chậm khắp nơi</text><text class="s" x="120" y="153" text-anchor="middle">Clip nào cũng chậm một chút</text></g>
<g class="gy"><rect class="bx" x="235" y="110" width="210" height="56" rx="8"/><text class="t" x="340" y="133" text-anchor="middle">Vài clip nặng</text><text class="s" x="340" y="153" text-anchor="middle">Nhiều hiệu ứng, NR, Fusion</text></g>
<g class="gy"><rect class="bx" x="455" y="110" width="210" height="56" rx="8"/><text class="t" x="560" y="133" text-anchor="middle">Mọi clip đều giật</text><text class="s" x="560" y="153" text-anchor="middle">Kể cả clip chưa chỉnh gì</text></g>
<path class="ar" d="M120 166 L120 206" marker-end="url(#a)"/>
<path class="ar" d="M340 166 L340 206" marker-end="url(#a)"/>
<path class="ar" d="M560 166 L560 206" marker-end="url(#a)"/>
<g class="tl"><rect class="bx" x="15" y="210" width="210" height="56" rx="8"/><text class="t" x="120" y="233" text-anchor="middle">Timeline Proxy Resolution</text><text class="s" x="120" y="253" text-anchor="middle">Playback → Half / Quarter</text></g>
<g class="tl"><rect class="bx" x="235" y="210" width="210" height="56" rx="8"/><text class="t" x="340" y="233" text-anchor="middle">Render Cache: Smart</text><text class="s" x="340" y="253" text-anchor="middle">Playback → Render Cache</text></g>
<g class="gy"><rect class="bx" x="455" y="210" width="210" height="56" rx="8"/><text class="t" x="560" y="233" text-anchor="middle">Chỉ dựng trên máy này?</text><text class="s" x="560" y="253" text-anchor="middle">Không mang file đi đâu</text></g>
<path class="ar" d="M520 266 L520 286 L340 286 L340 306" marker-end="url(#a)"/>
<path class="ar" d="M600 266 L600 306" marker-end="url(#a)"/>
<g class="gy"><text class="s" x="430" y="280" text-anchor="middle">Có</text></g>
<g class="gy"><text class="s" x="624" y="292" text-anchor="middle">Không</text></g>
<g class="pu"><rect class="bx" x="235" y="310" width="210" height="56" rx="8"/><text class="t" x="340" y="333" text-anchor="middle">Optimized Media</text><text class="s" x="340" y="353" text-anchor="middle">Generate Optimized Media</text></g>
<g class="pu"><rect class="bx" x="455" y="310" width="210" height="56" rx="8"/><text class="t" x="560" y="333" text-anchor="middle">Proxy Media</text><text class="s" x="560" y="353" text-anchor="middle">Generate Proxy Media</text></g>
<path class="ar" d="M120 266 L120 306" marker-end="url(#a)"/>
<g class="gy"><rect class="bx" x="15" y="310" width="210" height="56" rx="8"/><text class="t" x="120" y="333" text-anchor="middle">Vẫn giật?</text><text class="s" x="120" y="353" text-anchor="middle">Thử cột giữa, rồi cột phải</text></g>
<g class="gy"><text class="s" x="340" y="404" text-anchor="middle">Dùng kết hợp được, không loại trừ nhau (manual tr. 222–223).</text></g>
<g class="gy"><text class="s" x="340" y="426" text-anchor="middle">Xuất file luôn từ footage gốc, trừ khi tick Use Proxy Media lúc render.</text></g>
