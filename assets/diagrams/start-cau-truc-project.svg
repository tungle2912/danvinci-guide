<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img"><title>Bốn tầng của Resolve và bảng thiết lập ở mỗi tầng</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gy"><rect class="bx" x="40" y="30" width="600" height="56" rx="8"/><text class="t" x="56" y="53" text-anchor="start">Máy tính (tài khoản đăng nhập)</text><text class="s" x="56" y="73" text-anchor="start">Preferences: ổ cache, RAM, GPU, tự động lưu</text></g>
<path class="ar" d="M60 86 L60 138 L77 138" marker-end="url(#a)"/>
<g class="gy"><rect class="bx" x="80" y="110" width="560" height="56" rx="8"/><text class="t" x="96" y="133" text-anchor="start">Project library</text><text class="s" x="96" y="153" text-anchor="start">Kho chứa project — nút góc trên trái Project Manager</text></g>
<path class="ar" d="M100 166 L100 218 L117 218" marker-end="url(#a)"/>
<g class="tl"><rect class="bx" x="120" y="190" width="520" height="56" rx="8"/><text class="t" x="136" y="213" text-anchor="start">Project</text><text class="s" x="136" y="233" text-anchor="start">Project Settings (⇧9): frame rate, cỡ khung, màu, cache</text></g>
<path class="ar" d="M140 246 L140 298 L157 298" marker-end="url(#a)"/>
<g class="pu"><rect class="bx" x="160" y="270" width="480" height="56" rx="8"/><text class="t" x="176" y="293" text-anchor="start">Timeline</text><text class="s" x="176" y="313" text-anchor="start">Timeline Settings: mặc định theo project, tách riêng được</text></g>
<path class="ar" d="M180 326 L180 378 L197 378" marker-end="url(#a)"/>
<g class="co"><rect class="bx" x="200" y="350" width="440" height="56" rx="8"/><text class="t" x="216" y="373" text-anchor="start">Clip</text><text class="s" x="216" y="393" text-anchor="start">Clip Attributes, Inspector: riêng từng clip</text></g>
<g class="gy"><text class="s" x="340" y="440" text-anchor="middle">Tầng ngoài chứa tầng trong. Timeline lấy mặc định từ Project Settings.</text></g>
<g class="gy"><text class="s" x="340" y="462" text-anchor="middle">Export .drp mang theo Project, Timeline, Clip — Preferences ở lại máy.</text></g>
</svg>
