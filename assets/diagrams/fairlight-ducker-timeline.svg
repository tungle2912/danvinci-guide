<svg xmlns="http://www.w3.org/2000/svg" width="680" height="316" viewBox="0 0 680 316" role="img"><title>Ducker: nhạc nền tự nhỏ khi có lời và các thông số tương ứng</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gy"><rect class="bx" x="120" y="40" width="520" height="52" rx="6"/></g>
<g class="gy"><rect class="bx" x="120" y="112" width="520" height="96" rx="6"/></g>
<g class="co"><text class="t" x="20" y="71" text-anchor="start">A1 · Giọng</text></g>
<g class="pu"><text class="t" x="20" y="165" text-anchor="start">A2 · Nhạc</text></g>
<g class="co"><rect class="bx" x="210" y="50" width="140" height="32" rx="4"/><text class="s" x="280" y="70" text-anchor="middle">Lời</text></g>
<g class="co"><rect class="bx" x="470" y="50" width="120" height="32" rx="4"/><text class="s" x="530" y="70" text-anchor="middle">Lời</text></g>
<path d="M120 132 L195 132 L210 180 L370 180 L430 132 L455 132 L470 180 L610 180 L640 160" fill="none" stroke="#534AB7" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="210" y1="132" x2="370" y2="132" stroke="#888780" stroke-width="1" stroke-dasharray="4 4"/>
<line class="ar" x1="290" y1="136" x2="290" y2="174" marker-end="url(#a)"/>
<g class="co"><circle class="bx" cx="200" cy="104" r="10"/><text class="s" x="200" y="108" text-anchor="middle">1</text></g>
<g class="co"><circle class="bx" cx="306" cy="156" r="10"/><text class="s" x="306" y="160" text-anchor="middle">2</text></g>
<g class="co"><circle class="bx" cx="360" cy="196" r="10"/><text class="s" x="360" y="200" text-anchor="middle">3</text></g>
<g class="co"><circle class="bx" cx="410" cy="104" r="10"/><text class="s" x="410" y="108" text-anchor="middle">4</text></g>
<g class="tl"><text class="s" x="20" y="238" text-anchor="start">1 · Lookahead 15 ms, Rise Time 10 ms: nhạc bắt đầu nhỏ ngay trước lời</text></g>
<g class="tl"><text class="s" x="20" y="258" text-anchor="start">2 · Duck Level: nhạc nhỏ đi bao nhiêu dB. Mặc định 2.7 dB, hay dùng 2–5 dB</text></g>
<g class="tl"><text class="s" x="20" y="278" text-anchor="start">3 · Hold 150 ms: giữ mức nhỏ thêm một chút sau khi hết lời</text></g>
<g class="tl"><text class="s" x="20" y="298" text-anchor="start">4 · Recovery 750 ms: nhạc to dần trở lại</text></g>
</svg>
