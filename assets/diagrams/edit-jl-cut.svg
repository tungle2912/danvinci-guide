<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" role="img"><title>J-cut và L-cut: tiếng lấn sang hình của cảnh kế bên</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gy"><rect class="bx" x="16" y="16" width="316" height="218" rx="8"/>
</g>
<g class="gy"><text class="t" x="28" y="40" text-anchor="start">J-cut</text></g>
<g class="gy"><text class="s" x="28" y="78" text-anchor="start">V1</text></g>
<g class="gy"><text class="s" x="28" y="118" text-anchor="start">A1</text></g>
<g class="pu"><rect class="bx" x="56" y="58" width="160" height="30" rx="4"/>
<text class="s" x="136.0" y="78.0" text-anchor="middle">Hình A</text>
</g>
<g class="tl"><rect class="bx" x="216" y="58" width="106" height="30" rx="4"/>
<text class="s" x="269.0" y="78.0" text-anchor="middle">Hình B</text>
</g>
<g class="pu"><rect class="bx" x="56" y="98" width="110" height="30" rx="4"/>
<text class="s" x="111.0" y="118.0" text-anchor="middle">Tiếng A</text>
</g>
<g class="tl"><rect class="bx" x="166" y="98" width="156" height="30" rx="4"/>
<text class="s" x="244.0" y="118.0" text-anchor="middle">Tiếng B</text>
</g>
<line class="ar" x1="216" y1="50" x2="216" y2="136" stroke-dasharray="4 3"/>
<g class="co"><rect class="bx" x="166" y="142" width="50" height="8" rx="2"/></g>
<g class="gy"><text class="s" x="191.0" y="168" text-anchor="middle">đoạn lấn</text></g>
<g class="gy"><text class="s" x="28" y="198" text-anchor="start">Nghe tiếng B trước,</text></g>
<g class="gy"><text class="s" x="28" y="216" text-anchor="start">rồi mới thấy hình B</text></g>
<g class="gy"><rect class="bx" x="348" y="16" width="316" height="218" rx="8"/>
</g>
<g class="gy"><text class="t" x="360" y="40" text-anchor="start">L-cut</text></g>
<g class="gy"><text class="s" x="360" y="78" text-anchor="start">V1</text></g>
<g class="gy"><text class="s" x="360" y="118" text-anchor="start">A1</text></g>
<g class="pu"><rect class="bx" x="388" y="58" width="160" height="30" rx="4"/>
<text class="s" x="468.0" y="78.0" text-anchor="middle">Hình A</text>
</g>
<g class="tl"><rect class="bx" x="548" y="58" width="106" height="30" rx="4"/>
<text class="s" x="601.0" y="78.0" text-anchor="middle">Hình B</text>
</g>
<g class="pu"><rect class="bx" x="388" y="98" width="200" height="30" rx="4"/>
<text class="s" x="488.0" y="118.0" text-anchor="middle">Tiếng A</text>
</g>
<g class="tl"><rect class="bx" x="588" y="98" width="66" height="30" rx="4"/>
<text class="s" x="621.0" y="118.0" text-anchor="middle">Tiếng B</text>
</g>
<line class="ar" x1="548" y1="50" x2="548" y2="136" stroke-dasharray="4 3"/>
<g class="co"><rect class="bx" x="548" y="142" width="40" height="8" rx="2"/></g>
<g class="gy"><text class="s" x="568.0" y="168" text-anchor="middle">đoạn lấn</text></g>
<g class="gy"><text class="s" x="360" y="198" text-anchor="start">Hình đã sang B,</text></g>
<g class="gy"><text class="s" x="360" y="216" text-anchor="start">tiếng A vẫn còn</text></g>
</svg>
