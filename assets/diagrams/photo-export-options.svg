<svg xmlns="http://www.w3.org/2000/svg" width="680" height="396" viewBox="0 0 680 396" role="img"><title>Xuất ảnh dùng Quick Export hay trang Deliver</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gy"><rect class="bx" x="190" y="16" width="300" height="52" rx="8"/><text class="t" stroke="none" x="340" y="37.5" text-anchor="middle">Xuất ảnh: dùng cái nào?</text><text class="s" stroke="none" x="340" y="56.5" text-anchor="middle">Mở album, chọn ảnh cần xuất</text></g>
<g class="tl"><rect class="bx" x="16" y="100" width="316" height="44" rx="8"/><text class="t" stroke="none" x="174" y="127" text-anchor="middle">Một định dạng, một cỡ</text></g>
<g class="pu"><rect class="bx" x="348" y="100" width="316" height="44" rx="8"/><text class="t" stroke="none" x="506" y="127" text-anchor="middle">Nhiều cỡ hoặc nhiều định dạng</text></g>
<path class="ar" d="M290 70 L290 84 L174 84 L174 96" marker-end="url(#a)"/>
<path class="ar" d="M390 70 L390 84 L506 84 L506 96" marker-end="url(#a)"/>
<line class="ar" x1="174" y1="146" x2="174" y2="168" marker-end="url(#a)"/>
<line class="ar" x1="506" y1="146" x2="506" y2="168" marker-end="url(#a)"/>
<g class="tl"><rect class="bx" x="16" y="172" width="316" height="144" rx="8"/><text class="t" stroke="none" x="174" y="200" text-anchor="middle">Quick Export</text><text class="s" stroke="none" x="174" y="224" text-anchor="middle">Nút trên toolbar trang Photo</text><text class="s" stroke="none" x="174" y="248" text-anchor="middle">JPEG · PNG · HEIC · TIFF</text><text class="s" stroke="none" x="174" y="272" text-anchor="middle">Scale: gốc hoặc thu nhỏ theo %</text><text class="s" stroke="none" x="174" y="296" text-anchor="middle">Một tiền tố tên file</text></g>
<g class="pu"><rect class="bx" x="348" y="172" width="316" height="144" rx="8"/><text class="t" stroke="none" x="506" y="200" text-anchor="middle">Trang Deliver</text><text class="s" stroke="none" x="506" y="224" text-anchor="middle">Size: Long Side, Megapixels…</text><text class="s" stroke="none" x="506" y="248" text-anchor="middle">HEIF · JPEG · PNG · TIFF</text><text class="s" stroke="none" x="506" y="272" text-anchor="middle">Tên file chèn biến metadata %</text><text class="s" stroke="none" x="506" y="296" text-anchor="middle">Nhiều job → Render All</text></g>
<g class="gy"><rect class="bx" x="16" y="332" width="648" height="48" rx="8"/><text class="t" stroke="none" x="340" y="361" text-anchor="middle">Chỉ version đang chọn được xuất, ở độ phân giải gốc</text></g>
</svg>
