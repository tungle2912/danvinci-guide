<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img"><title>Năm vùng của trang Media trong DaVinci Resolve 21</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gy"><rect class="bx" x="20" y="20" width="640" height="34" rx="8"/><text class="s" x="340" y="41" text-anchor="middle" stroke="none">Interface Toolbar — 8 nút bật/tắt từng vùng</text></g>
<g class="tl"><rect class="bx" x="20" y="66" width="190" height="130" rx="8"/><text class="t" x="115" y="118" text-anchor="middle">1  Media Storage</text><text class="s" x="115" y="136" text-anchor="middle">Duyệt ổ đĩa</text><text class="s" x="115" y="154" text-anchor="middle">Xem trước khi nạp</text></g>
<g class="pu"><rect class="bx" x="222" y="66" width="256" height="130" rx="8"/><text class="t" x="350" y="118" text-anchor="middle">2  Viewer</text><text class="s" x="350" y="136" text-anchor="middle">Xem clip, đặt In / Out</text><text class="s" x="350" y="154" text-anchor="middle">Phát, tua, Make Subclip</text></g>
<g class="co"><rect class="bx" x="490" y="66" width="170" height="130" rx="8"/><text class="t" x="575" y="118" text-anchor="middle">3  Audio Panel</text><text class="s" x="575" y="136" text-anchor="middle">Meters | Waveform</text><text class="s" x="575" y="154" text-anchor="middle">Đo tiếng, đồng bộ tay</text></g>
<g class="tl"><rect class="bx" x="20" y="208" width="458" height="102" rx="8"/><text class="t" x="249" y="246" text-anchor="middle">5  Media Pool</text><text class="s" x="249" y="264" text-anchor="middle">Bin List bên trái · clip của bin bên phải</text><text class="s" x="249" y="282" text-anchor="middle">Kho clip của project</text></g>
<g class="gy"><rect class="bx" x="490" y="208" width="170" height="102" rx="8"/><text class="t" x="575" y="246" text-anchor="middle" stroke="none">4  Metadata</text><text class="s" x="575" y="264" text-anchor="middle" stroke="none">Thông tin clip</text><text class="s" x="575" y="282" text-anchor="middle" stroke="none">Nơi gõ ghi chú</text></g>
</svg>
