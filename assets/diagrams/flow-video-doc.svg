<g class="co"><rect class="bx" x="16" y="488" width="300" height="52" rx="8"/><text class="t" stroke="none" x="166" y="509.5" text-anchor="middle">Không phụ đề</text><text class="s" stroke="none" x="166" y="528.5" text-anchor="middle">Preset TikTok + Use vertical resolution</text></g>
<g class="co"><rect class="bx" x="364" y="488" width="300" height="52" rx="8"/><text class="t" stroke="none" x="514" y="509.5" text-anchor="middle">Có phụ đề</text><text class="s" stroke="none" x="514" y="528.5" text-anchor="middle">Custom Export · Burn into video</text></g>
