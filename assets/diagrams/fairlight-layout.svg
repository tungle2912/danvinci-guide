<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img"><title>Bố cục trang Fairlight</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gy"><rect class="bx" x="40" y="30" width="600" height="430" rx="20"/></g>
<g class="pu"><rect class="bx" x="60" y="50" width="560" height="52" rx="8"/><text class="s" x="340" y="71" text-anchor="middle">Trái: Media Pool · Effects · Index · Groups · Sound Library · ADR</text><text class="s" x="340" y="90" text-anchor="middle">Phải: Mixer · Meters · Metadata · Inspector</text></g>
<g class="tl"><rect class="bx" x="60" y="118" width="440" height="80" rx="10"/><text class="t" x="280" y="146" text-anchor="middle">Meters (Monitoring panel)</text><text class="s" x="280" y="168" text-anchor="middle">Đồng hồ từng track · Bus · Control Room · Loudness</text></g>
<g class="tl"><rect class="bx" x="516" y="118" width="104" height="80" rx="10"/><text class="t" x="568" y="152" text-anchor="middle">Viewer</text><text class="s" x="568" y="172" text-anchor="middle">Hình tham chiếu</text></g>
<g class="gy"><rect class="bx" x="60" y="214" width="560" height="34" rx="6"/><text class="s" x="340" y="236" text-anchor="middle">Timecode · chọn timeline · nút phát/thu · Automation · loa, DIM</text></g>
<g class="co"><rect class="bx" x="60" y="264" width="90" height="176" rx="10"/><text class="t" x="105" y="336" text-anchor="middle">Đầu track</text><text class="s" x="105" y="356" text-anchor="middle">Khoá · R · S · M</text></g>
<g class="co"><rect class="bx" x="160" y="264" width="300" height="176" rx="10"/><text class="t" x="310" y="290" text-anchor="middle">Timeline âm thanh</text><text class="s" x="310" y="310" text-anchor="middle">Thanh công cụ ở mép trên</text><text class="s" x="310" y="356" text-anchor="middle">Mỗi track chia làn theo số kênh</text><text class="s" x="310" y="376" text-anchor="middle">Mono 1 làn, stereo 2 làn</text></g>
<g class="pu"><rect class="bx" x="476" y="264" width="144" height="176" rx="10"/><text class="t" x="548" y="300" text-anchor="middle">Mixer</text><text class="s" x="548" y="324" text-anchor="middle">Mỗi track một cột</text><text class="s" x="548" y="344" text-anchor="middle">Input · Track FX</text><text class="s" x="548" y="364" text-anchor="middle">Effects · Dynamics · EQ</text><text class="s" x="548" y="384" text-anchor="middle">Pan · fader</text><text class="s" x="548" y="404" text-anchor="middle">Cột cuối: Bus 1</text></g>
</svg>
