<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img"><title>Dựng multicam: bấm góc máy ở Viewer Source, timeline tự cắt</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gy"><rect class="bx" x="16" y="16" width="236" height="230" rx="8"/>
</g>
<g class="gy"><text class="t" x="28" y="40" text-anchor="start">Viewer Source · Multicam</text></g>
<g class="tl"><rect class="bx" x="28" y="54" width="100" height="64" rx="4"/>
<text class="s" x="78.0" y="91.0" text-anchor="middle">1 · Góc rộng</text>
</g>
<g class="co"><rect class="bx" x="136" y="54" width="100" height="64" rx="4"/>
<text class="s" x="186.0" y="91.0" text-anchor="middle">2 · Cận mặt</text>
</g>
<g class="tl"><rect class="bx" x="28" y="128" width="100" height="64" rx="4"/>
<text class="s" x="78.0" y="165.0" text-anchor="middle">3 · Tay</text>
</g>
<g class="tl"><rect class="bx" x="136" y="128" width="100" height="64" rx="4"/>
<text class="s" x="186.0" y="165.0" text-anchor="middle">4 · Từ trên</text>
</g>
<g class="gy"><text class="s" x="28" y="228" text-anchor="start">Ô tô màu = góc đang phát</text></g>
<line class="ar" x1="256" y1="100" x2="300" y2="100" marker-end="url(#a)"/>
<g class="gy"><rect class="bx" x="304" y="16" width="360" height="230" rx="8"/>
</g>
<g class="gy"><text class="t" x="316" y="40" text-anchor="start">Timeline sau khi bấm 1 → 2 → 3 → 1</text></g>
<g class="tl"><rect class="bx" x="320" y="60" width="70" height="30" rx="4"/>
<text class="s" x="355.0" y="80.0" text-anchor="middle">Góc 1</text>
</g>
<g class="co"><rect class="bx" x="390" y="60" width="90" height="30" rx="4"/>
<text class="s" x="435.0" y="80.0" text-anchor="middle">Góc 2</text>
</g>
<g class="tl"><rect class="bx" x="480" y="60" width="60" height="30" rx="4"/>
<text class="s" x="510.0" y="80.0" text-anchor="middle">Góc 3</text>
</g>
<g class="tl"><rect class="bx" x="540" y="60" width="110" height="30" rx="4"/>
<text class="s" x="595.0" y="80.0" text-anchor="middle">Góc 1</text>
</g>
<g class="gy"><rect class="bx" x="320" y="96" width="330" height="22" rx="4"/>
<text class="s" x="485.0" y="112.0" text-anchor="middle">Tiếng giữ một nguồn (chế độ chỉ hình)</text>
</g>
<g class="gy"><text class="s" x="312" y="146" text-anchor="start">Bấm góc / phím 1–9</text></g>
<g class="gy"><text class="s" x="440" y="146" text-anchor="start">cắt tại con trỏ và chuyển góc</text></g>
<g class="gy"><text class="s" x="312" y="170" text-anchor="start">⌥-bấm / ⌥1–9</text></g>
<g class="gy"><text class="s" x="440" y="170" text-anchor="start">đổi góc đoạn hiện tại, không cắt</text></g>
<g class="gy"><text class="s" x="312" y="194" text-anchor="start">⌘⇧← / ⌘⇧→</text></g>
<g class="gy"><text class="s" x="440" y="194" text-anchor="start">góc trước / góc sau</text></g>
<g class="gy"><text class="s" x="312" y="218" text-anchor="start">⌥⇧[ ] \</text></g>
<g class="gy"><text class="s" x="440" y="218" text-anchor="start">cả hai / chỉ hình / chỉ tiếng</text></g>
<g class="gy"><text class="s" x="340" y="274" text-anchor="middle">Dừng phát là xong. Mỗi đoạn vẫn trim, đổi góc lại được như clip thường</text></g>
</svg>
