<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" role="img"><title>Ba loại bin trong Media Pool: Bin, Power Bin và Smart Bin</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="tl"><rect class="bx" x="20" y="20" width="200" height="132" rx="8"/><text class="t" x="120" y="64" text-anchor="middle">Bin</text><text class="s" x="120" y="82" text-anchor="middle">Chứa clip bạn kéo vào</text><text class="s" x="120" y="100" text-anchor="middle">Master là bin gốc</text><text class="s" x="120" y="118" text-anchor="middle">Luôn hiện</text></g>
<g class="pu"><rect class="bx" x="240" y="20" width="200" height="132" rx="8"/><text class="t" x="340" y="64" text-anchor="middle">Power Bin</text><text class="s" x="340" y="82" text-anchor="middle">Chứa clip bạn kéo vào</text><text class="s" x="340" y="100" text-anchor="middle">Mặc định ẩn</text><text class="s" x="340" y="118" text-anchor="middle">Show Power Bins để hiện</text></g>
<g class="co"><rect class="bx" x="460" y="20" width="200" height="132" rx="8"/><text class="t" x="560" y="64" text-anchor="middle">Smart Bin</text><text class="s" x="560" y="82" text-anchor="middle">Không chứa clip</text><text class="s" x="560" y="100" text-anchor="middle">Tự lọc theo metadata</text><text class="s" x="560" y="118" text-anchor="middle">Tự cập nhật</text></g>
<line class="ar" x1="120" y1="152" x2="120" y2="198" marker-end="url(#a)"/>
<line class="ar" x1="340" y1="152" x2="340" y2="198" marker-end="url(#a)"/>
<line class="ar" x1="560" y1="152" x2="560" y2="198" marker-end="url(#a)"/>
<g class="gy"><rect class="bx" x="20" y="200" width="200" height="60" rx="8"/><text class="t" x="120" y="226" text-anchor="middle" stroke="none">Chỉ project này</text><text class="s" x="120" y="244" text-anchor="middle" stroke="none">Xoá bin không xoá file</text></g>
<g class="gy"><rect class="bx" x="240" y="200" width="200" height="60" rx="8"/><text class="t" x="340" y="226" text-anchor="middle" stroke="none">Mọi project</text><text class="s" x="340" y="244" text-anchor="middle" stroke="none">Của cùng người dùng</text></g>
<g class="gy"><rect class="bx" x="460" y="200" width="200" height="60" rx="8"/><text class="t" x="560" y="226" text-anchor="middle" stroke="none">Clip khớp điều kiện</text><text class="s" x="560" y="244" text-anchor="middle" stroke="none">Xoá Smart Bin: clip còn</text></g>
</svg>
