<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img"><title>Cách đọc Vectorscope</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<circle cx="190" cy="170" r="130" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<path d="M60 170 L320 170 M190 40 L190 300" stroke="#D3D1C7" stroke-width="1" fill="none"/>
<rect x="161" y="68" width="14" height="14" fill="none" stroke="#C0392B" stroke-width="1.5"/>
<text stroke="none" class="t" x="164" y="62" text-anchor="middle" fill="#C0392B">R</text>
<rect x="231" y="77" width="14" height="14" fill="none" stroke="#9B3C8E" stroke-width="1.5"/>
<text stroke="none" class="t" x="246" y="74" text-anchor="middle" fill="#9B3C8E">Mg</text>
<rect x="278" y="185" width="14" height="14" fill="none" stroke="#3557B7" stroke-width="1.5"/>
<text stroke="none" class="t" x="303" y="201" text-anchor="middle" fill="#3557B7">B</text>
<rect x="205" y="258" width="14" height="14" fill="none" stroke="#1F8A8A" stroke-width="1.5"/>
<text stroke="none" class="t" x="216" y="288" text-anchor="middle" fill="#1F8A8A">Cy</text>
<rect x="135" y="249" width="14" height="14" fill="none" stroke="#2E8B57" stroke-width="1.5"/>
<text stroke="none" class="t" x="134" y="276" text-anchor="middle" fill="#2E8B57">G</text>
<rect x="88" y="141" width="14" height="14" fill="none" stroke="#9A7B0A" stroke-width="1.5"/>
<text stroke="none" class="t" x="77" y="149" text-anchor="middle" fill="#9A7B0A">Yl</text>
<path d="M190 170 L119 61" stroke="#993C1D" stroke-width="2" stroke-dasharray="5 3" fill="none"/>
<g class="co"><text stroke="none" class="s" x="115" y="53" text-anchor="middle">vạch màu da</text></g>
<ellipse cx="174" cy="145" rx="34" ry="14" transform="rotate(57 174 145)" fill="#E8B9A6" fill-opacity="0.7" stroke="#993C1D" stroke-width="1"/>
<g class="gy"><rect class="bx" x="370" y="52" width="290" height="236" rx="10"/>
<text stroke="none" class="t" x="386" y="80">Đọc Vectorscope</text>
<text stroke="none" class="s" x="386" y="112">• Tâm = không màu: trắng, xám, đen</text>
<text stroke="none" class="s" x="386" y="142">• Càng xa tâm = màu càng đậm</text>
<text stroke="none" class="s" x="386" y="172">• Hướng = loại màu (R, Yl, G…)</text>
<text stroke="none" class="s" x="386" y="202">• Cả đám lệch về một phía = ám màu</text>
<text stroke="none" class="s" x="386" y="232">• Da người nằm trên vạch màu da</text>
<text stroke="none" class="s" x="386" y="262">• Chạm ô mục tiêu = màu quá rực</text>
</g>
</svg>
