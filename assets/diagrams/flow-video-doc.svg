.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gy"><rect class="bx" x="190" y="16" width="300" height="48" rx="8"/><text class="t" stroke="none" x="340" y="45" text-anchor="middle">Footage quay thế nào?</text></g>
<g class="tl"><rect class="bx" x="16" y="96" width="300" height="52" rx="8"/><text class="t" stroke="none" x="166" y="117.5" text-anchor="middle">A — Quay dọc sẵn</text><text class="s" stroke="none" x="166" y="136.5" text-anchor="middle">điện thoại, khung 9:16</text></g>
<g class="tl"><rect class="bx" x="16" y="172" width="300" height="52" rx="8"/><text class="t" stroke="none" x="166" y="193.5" text-anchor="middle">Project Settings</text><text class="s" stroke="none" x="166" y="212.5" text-anchor="middle">tick Use vertical resolution</text></g>
<g class="tl"><rect class="bx" x="16" y="248" width="300" height="52" rx="8"/><text class="t" stroke="none" x="166" y="269.5" text-anchor="middle">Dựng như bình thường</text><text class="s" stroke="none" x="166" y="288.5" text-anchor="middle">trang Cut tự đổi giao diện dọc</text></g>
<g class="pu"><rect class="bx" x="364" y="96" width="300" height="52" rx="8"/><text class="t" stroke="none" x="514" y="117.5" text-anchor="middle">B — Có bản ngang</text><text class="s" stroke="none" x="514" y="136.5" text-anchor="middle">muốn thêm một bản dọc</text></g>
<g class="pu"><rect class="bx" x="364" y="172" width="300" height="52" rx="8"/><text class="t" stroke="none" x="514" y="193.5" text-anchor="middle">Duplicate Timeline</text><text class="s" stroke="none" x="514" y="212.5" text-anchor="middle">bản ngang dựng xong trước</text></g>
<g class="pu"><rect class="bx" x="364" y="248" width="300" height="52" rx="8"/><text class="t" stroke="none" x="514" y="269.5" text-anchor="middle">Timeline Settings</text><text class="s" stroke="none" x="514" y="288.5" text-anchor="middle">bỏ Use Project Settings, tick dọc</text></g>
<g class="pu"><rect class="bx" x="364" y="324" width="300" height="52" rx="8"/><text class="t" stroke="none" x="514" y="345.5" text-anchor="middle">Scale full frame with crop</text><text class="s" stroke="none" x="514" y="364.5" text-anchor="middle">chỉnh tay Position X clip lệch</text></g>
