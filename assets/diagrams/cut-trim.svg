<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" role="img"><title>Bốn vị trí rê chuột để trim trên trang Cut</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="tl"><rect class="bx" x="80" y="50" width="250" height="56" rx="4"/><text class="s" x="205" y="94" text-anchor="middle">Clip A — hình</text></g>
<g class="tl"><rect class="bx" x="80" y="106" width="250" height="34" rx="4"/><text class="s" x="205" y="128" text-anchor="middle">tiếng</text></g>
<g class="pu"><rect class="bx" x="330" y="50" width="270" height="56" rx="4"/><text class="s" x="465" y="94" text-anchor="middle">Clip B — hình</text></g>
<g class="pu"><rect class="bx" x="330" y="106" width="270" height="34" rx="4"/><text class="s" x="465" y="128" text-anchor="middle">tiếng</text></g>
<g class="co"><rect class="bx" x="452" y="58" width="26" height="16" rx="3"/></g>
<g class="co"><circle class="bx" cx="80" cy="30" r="12"/><text class="t" x="80" y="35" text-anchor="middle">1</text></g>
<g class="co"><circle class="bx" cx="330" cy="30" r="12"/><text class="t" x="330" y="35" text-anchor="middle">2</text></g>
<g class="co"><circle class="bx" cx="465" cy="30" r="12"/><text class="t" x="465" y="35" text-anchor="middle">3</text></g>
<g class="co"><circle class="bx" cx="330" cy="160" r="12"/><text class="t" x="330" y="165" text-anchor="middle">4</text></g>
<line class="ar" x1="80" y1="42" x2="80" y2="50"/>
<line class="ar" x1="330" y1="42" x2="330" y2="50"/>
<line class="ar" x1="465" y1="42" x2="465" y2="58"/>
<line class="ar" x1="330" y1="148" x2="330" y2="140"/>
<g class="gy"><rect class="bx" x="80" y="190" width="520" height="110" rx="10"/>
<text class="s" x="100" y="215">1  Mép clip — co giãn clip, Track 1 tự dồn phần sau</text>
<text class="s" x="100" y="240">2  Giữa điểm nối — Roll: dời điểm chuyển cảnh, tổng độ dài giữ nguyên</text>
<text class="s" x="100" y="265">3  Tay nắm giữa thân clip — Slip: đổi khúc nội dung, vị trí giữ nguyên</text>
<text class="s" x="100" y="290">4  Nửa dưới điểm nối (hiện nốt nhạc) — chỉ trim tiếng: J-cut, L-cut</text>
</g>
</svg>
