<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img"><title>Bố cục trang Photo</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gy"><rect class="bx" x="40" y="30" width="600" height="410" rx="20"/></g>
<g class="pu"><rect class="bx" x="60" y="50" width="560" height="36" rx="8"/><text class="s" x="340" y="73" text-anchor="middle">Media Pool · Effects · Photo Album · Quick Export · Metadata · Capture · Inspector</text></g>
<g class="pu"><rect class="bx" x="60" y="102" width="130" height="220" rx="10"/><text class="t" x="125" y="200" text-anchor="middle">Media Pool</text><text class="s" x="125" y="222" text-anchor="middle">Chỉ hiện ảnh</text></g>
<g class="tl"><rect class="bx" x="206" y="102" width="250" height="220" rx="10"/><text class="t" x="331" y="190" text-anchor="middle">Viewer</text><text class="s" x="331" y="212" text-anchor="middle">Thanh trên: zoom, Lightbox</text><text class="s" x="331" y="230" text-anchor="middle">Thanh dưới: Tools, sao, cờ</text></g>
<g class="co"><rect class="bx" x="472" y="102" width="148" height="140" rx="10"/><text class="t" x="546" y="152" text-anchor="middle">Inspector</text><text class="s" x="546" y="174" text-anchor="middle">RAW · Photo</text><text class="s" x="546" y="192" text-anchor="middle">Effects · File</text></g>
<g class="tl"><rect class="bx" x="472" y="254" width="148" height="68" rx="10"/><text class="t" x="546" y="285" text-anchor="middle">Histogram</text><text class="s" x="546" y="305" text-anchor="middle">Scope mặc định</text></g>
<g class="co"><rect class="bx" x="60" y="338" width="560" height="82" rx="10"/><text class="t" x="340" y="370" text-anchor="middle">Photo Album</text><text class="s" x="340" y="392" text-anchor="middle">Dải ảnh đang chỉnh, có bộ lọc theo sao, cờ, tag, màu</text></g>
</svg>
