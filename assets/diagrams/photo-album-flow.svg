<svg xmlns="http://www.w3.org/2000/svg" width="680" height="332" viewBox="0 0 680 332" role="img"><title>Luồng làm việc với album ở trang Photo: nạp, tạo album, loại và chấm sao, lọc, chỉnh, versions, xuất</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gy"><rect class="bx" x="16" y="20" width="196" height="76" rx="8"/><text class="t" stroke="none" x="114" y="44" text-anchor="middle">1  Nạp ảnh</text><text class="s" stroke="none" x="114" y="63" text-anchor="middle">Import Media</text><text class="s" stroke="none" x="114" y="82" text-anchor="middle">hoặc kéo từ Finder</text></g>
<g class="tl"><rect class="bx" x="242" y="20" width="196" height="76" rx="8"/><text class="t" stroke="none" x="340" y="44" text-anchor="middle">2  Tạo album</text><text class="s" stroke="none" x="340" y="63" text-anchor="middle">New Photo Album</text><text class="s" stroke="none" x="340" y="82" text-anchor="middle">Add Photo(s) to Album</text></g>
<g class="tl"><rect class="bx" x="468" y="20" width="196" height="76" rx="8"/><text class="t" stroke="none" x="566" y="44" text-anchor="middle">3  Loại, chấm sao</text><text class="s" stroke="none" x="566" y="63" text-anchor="middle">X loại · S tốt</text><text class="s" stroke="none" x="566" y="82" text-anchor="middle">phím 1–5 chấm sao</text></g>
<g class="tl"><rect class="bx" x="468" y="128" width="196" height="76" rx="8"/><text class="t" stroke="none" x="566" y="152" text-anchor="middle">4  Lọc album</text><text class="s" stroke="none" x="566" y="171" text-anchor="middle">Ratings: 4 sao trở lên</text><text class="s" stroke="none" x="566" y="190" text-anchor="middle">Tags: bỏ Rejected</text></g>
<g class="pu"><rect class="bx" x="242" y="128" width="196" height="76" rx="8"/><text class="t" stroke="none" x="340" y="152" text-anchor="middle">5  Chỉnh</text><text class="s" stroke="none" x="340" y="171" text-anchor="middle">tab RAW → tab Photo</text><text class="s" stroke="none" x="340" y="190" text-anchor="middle">→ Tools → hiệu ứng</text></g>
<g class="pu"><rect class="bx" x="16" y="128" width="196" height="76" rx="8"/><text class="t" stroke="none" x="114" y="152" text-anchor="middle">6  Versions</text><text class="s" stroke="none" x="114" y="171" text-anchor="middle">New Version: thử kiểu khác</text><text class="s" stroke="none" x="114" y="190" text-anchor="middle">mà giữ bản cũ</text></g>
<g class="co"><rect class="bx" x="16" y="236" width="196" height="76" rx="8"/><text class="t" stroke="none" x="114" y="260" text-anchor="middle">7  Xuất</text><text class="s" stroke="none" x="114" y="279" text-anchor="middle">Quick Export: nhanh</text><text class="s" stroke="none" x="114" y="298" text-anchor="middle">Deliver: nhiều cỡ</text></g>
<g class="gy"><rect class="bx" x="242" y="236" width="422" height="76" rx="8"/><text class="t" stroke="none" x="453" y="260" text-anchor="middle">Ảnh nằm ở 2 album = chung một chỉnh sửa</text><text class="s" stroke="none" x="453" y="279" text-anchor="middle">Muốn hai kiểu khác nhau: dùng Versions</text><text class="s" stroke="none" x="453" y="298" text-anchor="middle">Xuất ra version đang chọn, độ phân giải gốc</text></g>
<line class="ar" x1="214" y1="58" x2="238" y2="58" marker-end="url(#a)"/>
<line class="ar" x1="440" y1="58" x2="464" y2="58" marker-end="url(#a)"/>
<line class="ar" x1="566" y1="98" x2="566" y2="124" marker-end="url(#a)"/>
<line class="ar" x1="466" y1="166" x2="442" y2="166" marker-end="url(#a)"/>
<line class="ar" x1="240" y1="166" x2="216" y2="166" marker-end="url(#a)"/>
<line class="ar" x1="114" y1="206" x2="114" y2="232" marker-end="url(#a)"/>
</svg>
