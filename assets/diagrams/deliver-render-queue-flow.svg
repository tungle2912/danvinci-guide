<svg xmlns="http://www.w3.org/2000/svg" width="680" height="306" viewBox="0 0 680 306" role="img"><title>Các bước từ thiết lập tới render trên trang Deliver</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="tl"><rect class="bx" x="25" y="40" width="190" height="84" rx="8"/><text class="t" x="120" y="68" text-anchor="middle">1 · Chọn timeline</text><text class="s" x="120" y="88" text-anchor="middle">Menu tên timeline</text><text class="s" x="120" y="106" text-anchor="middle">ở đầu Viewer</text></g>
<g class="tl"><rect class="bx" x="245" y="40" width="190" height="84" rx="8"/><text class="t" x="340" y="68" text-anchor="middle">2 · Chọn preset</text><text class="s" x="340" y="88" text-anchor="middle">Ô Preset → YouTube…</text><text class="s" x="340" y="106" text-anchor="middle">đổi ô cần đổi</text></g>
<g class="tl"><rect class="bx" x="465" y="40" width="190" height="84" rx="8"/><text class="t" x="560" y="68" text-anchor="middle">3 · Chọn khoảng</text><text class="s" x="560" y="88" text-anchor="middle">Entire Timeline</text><text class="s" x="560" y="106" text-anchor="middle">hoặc In/Out Range</text></g>
<line class="ar" x1="217" y1="82" x2="241" y2="82" marker-end="url(#a)"/>
<line class="ar" x1="437" y1="82" x2="461" y2="82" marker-end="url(#a)"/>
<g class="pu"><rect class="bx" x="25" y="176" width="190" height="84" rx="8"/><text class="t" x="120" y="204" text-anchor="middle">4 · Add to Render Queue</text><text class="s" x="120" y="224" text-anchor="middle">Thành một job</text><text class="s" x="120" y="242" text-anchor="middle">ở Render Queue</text></g>
<g class="pu"><rect class="bx" x="245" y="176" width="190" height="84" rx="8"/><text class="t" x="340" y="204" text-anchor="middle">5 · Render All</text><text class="s" x="340" y="224" text-anchor="middle">Chạy job từ trên xuống</text><text class="s" x="340" y="242" text-anchor="middle">Render N: chỉ job chọn</text></g>
<g class="co"><rect class="bx" x="465" y="176" width="190" height="84" rx="8"/><text class="t" x="560" y="204" text-anchor="middle">6 · Reveal in Finder</text><text class="s" x="560" y="224" text-anchor="middle">Chuột phải job</text><text class="s" x="560" y="242" text-anchor="middle">mở file xem thử</text></g>
<line class="ar" x1="217" y1="218" x2="241" y2="218" marker-end="url(#a)"/>
<line class="ar" x1="437" y1="218" x2="461" y2="218" marker-end="url(#a)"/>
<path class="ar" d="M560 126 L560 150 L120 150 L120 168" marker-end="url(#a)"/>
<path class="ar" d="M25 218 L12 218 L12 82 L21 82" marker-end="url(#a)"/>
<g class="co"><text class="s" x="340" y="290" text-anchor="middle">Cần thêm phiên bản: quay lại bước 1–3 rồi bấm Add to Render Queue lần nữa</text></g>
</svg>
