<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img"><title>Timeline hai tầng trang Cut: tầng trên toàn cảnh, tầng dưới phóng to</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gy"><text class="t" x="20" y="28">Timeline trên — luôn thấy cả video, dài bao nhiêu cũng vừa</text></g>
<g class="gy"><rect class="bx" x="20" y="40" width="640" height="50" rx="6"/></g>
<g class="gy"><rect class="bx" x="30" y="55" width="103" height="20" rx="3"/></g>
<g class="gy"><text class="s" x="81.5" y="69" text-anchor="middle">1</text></g>
<g class="gy"><rect class="bx" x="133" y="55" width="103" height="20" rx="3"/></g>
<g class="gy"><text class="s" x="184.5" y="69" text-anchor="middle">2</text></g>
<g class="gy"><rect class="bx" x="236" y="55" width="103" height="20" rx="3"/></g>
<g class="gy"><text class="s" x="287.5" y="69" text-anchor="middle">3</text></g>
<g class="gy"><rect class="bx" x="339" y="55" width="103" height="20" rx="3"/></g>
<g class="gy"><text class="s" x="390.5" y="69" text-anchor="middle">4</text></g>
<g class="gy"><rect class="bx" x="442" y="55" width="103" height="20" rx="3"/></g>
<g class="gy"><text class="s" x="493.5" y="69" text-anchor="middle">5</text></g>
<g class="gy"><rect class="bx" x="545" y="55" width="103" height="20" rx="3"/></g>
<g class="gy"><text class="s" x="596.5" y="69" text-anchor="middle">6</text></g>
<g class="pu"><rect class="bx" x="200" y="46" width="100" height="38" rx="4" fill-opacity="0.45"/></g>
<g class="co"><rect class="bx" x="249" y="44" width="2" height="42" rx="0"/></g>
<line class="ar" x1="200" y1="90" x2="22" y2="148" stroke-dasharray="4 4"/>
<line class="ar" x1="300" y1="90" x2="658" y2="148" stroke-dasharray="4 4"/>
<g class="gy"><rect class="bx" x="20" y="150" width="640" height="90" rx="6"/></g>
<g class="gy"><rect class="bx" x="30" y="172" width="223" height="46" rx="3"/></g>
<g class="gy"><text class="s" x="141.5" y="199" text-anchor="middle">Clip 2</text></g>
<g class="gy"><rect class="bx" x="253" y="172" width="397" height="46" rx="3"/></g>
<g class="gy"><text class="s" x="451.5" y="199" text-anchor="middle">Clip 3</text></g>
<g class="co"><rect class="bx" x="339" y="156" width="2" height="78" rx="0"/></g>
<g class="gy"><text class="t" x="20" y="264">Timeline dưới — phóng to quanh con trỏ, mức zoom cố định</text></g>
<g class="gy"><text class="s" x="20" y="286">Ô tím: đoạn tầng dưới đang hiện. Vạch cam: con trỏ. Kéo clip qua lại giữa hai tầng được.</text></g>
