<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img"><title>Bố cục trang Color</title>
<style>
.bx{stroke-width:1}
.t{font:500 14px -apple-system,Helvetica,Arial,sans-serif}
.s{font:400 12px -apple-system,Helvetica,Arial,sans-serif}
.gy rect,.gy circle,.gy{fill:#F1EFE8;stroke:#5F5E5A}.gy .t{fill:#2C2C2A}.gy .s{fill:#5F5E5A}
.tl rect,.tl circle{fill:#E1F5EE;stroke:#0F6E56}.tl .t{fill:#04342C}.tl .s{fill:#0F6E56}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .t{fill:#26215C}.pu .s{fill:#534AB7}
.co rect,.co circle{fill:#FAECE7;stroke:#993C1D}.co .t{fill:#4A1B0C}.co .s{fill:#993C1D}
.ar{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gy"><rect class="bx" x="40" y="20" width="600" height="480" rx="20"/></g>
<g class="pu"><rect class="bx" x="60" y="36" width="560" height="40" rx="8"/><text class="s" x="340" y="61" text-anchor="middle">Toolbar: Gallery · LUTs · Media Pool · Clips ▾ · Timeline · Nodes · Effects · Lightbox</text></g>
<g class="co"><rect class="bx" x="60" y="90" width="130" height="150" rx="10"/><text class="t" x="125" y="150" text-anchor="middle">Gallery</text><text class="s" x="125" y="172" text-anchor="middle">Still, PowerGrade</text><text class="s" x="125" y="190" text-anchor="middle">(LUTs, Media Pool)</text></g>
<g class="tl"><rect class="bx" x="204" y="90" width="236" height="150" rx="10"/><text class="t" x="322" y="124" text-anchor="middle">Viewer</text><text class="s" x="322" y="146" text-anchor="middle">Trên: Wipe · Split Screen · Highlight</text><text class="s" x="322" y="166" text-anchor="middle">Dưới: jog, phát, Loop, Unmix</text><text class="s" x="322" y="186" text-anchor="middle">Góc dưới trái: menu onscreen</text></g>
<g class="co"><rect class="bx" x="454" y="90" width="166" height="150" rx="10"/><text class="t" x="537" y="150" text-anchor="middle">Node Editor</text><text class="s" x="537" y="172" text-anchor="middle">Chuỗi node, ⌥S</text><text class="s" x="537" y="190" text-anchor="middle">Chấm Clip / Timeline</text></g>
<g class="gy"><rect class="bx" x="60" y="254" width="560" height="64" rx="10"/><text class="t" x="340" y="280" text-anchor="middle">Dải clip (Thumbnail timeline)</text><text class="s" x="340" y="300" text-anchor="middle">Mini-Timeline ngay dưới — bật bằng nút Timeline</text></g>
<g class="pu"><rect class="bx" x="60" y="332" width="560" height="34" rx="8"/><text class="s" x="340" y="354" text-anchor="middle">Hàng icon palette — chấm cam = node đang chọn có chỉnh ở palette đó</text></g>
<g class="co"><rect class="bx" x="60" y="380" width="180" height="100" rx="10"/><text class="t" x="150" y="420" text-anchor="middle">Palette trái</text><text class="s" x="150" y="442" text-anchor="middle">Color Wheels, HDR, RGB</text></g>
<g class="co"><rect class="bx" x="254" y="380" width="186" height="100" rx="10"/><text class="t" x="347" y="420" text-anchor="middle">Palette giữa</text><text class="s" x="347" y="442" text-anchor="middle">Curves, Qualifier, Window</text></g>
<g class="tl"><rect class="bx" x="454" y="380" width="166" height="100" rx="10"/><text class="t" x="537" y="420" text-anchor="middle">Góc dưới phải</text><text class="s" x="537" y="442" text-anchor="middle">Keyframes · Scopes · Info</text></g>
</svg>
